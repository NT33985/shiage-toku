<script type="application/json" id="qdata_R7-45">{"id":"R7-45","year":"R7","number":45,"question":"セラミック皮膜加工に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"プラズマ溶射には、酸化アルミニウム皮膜、酸化アルミニウム・酸化チタン皮膜、酸化アルミニウム・酸化クロム皮膜、酸化クロム皮膜、酸化チタン皮膜及び酸化ジルコニウム皮膜が用いられる。"},{"key":"ロ","text":"プラズマ溶射における酸化ジルコニウム皮膜は、耐摩耗用には用いられない。"},{"key":"ハ","text":"粉末式フレーム溶射には、酸化アルミニウム皮膜、酸化アルミニウム・酸化チタン皮膜、酸化クロム皮膜、酸化チタン皮膜及び酸化ジルコニウム皮膜が用いられる。"},{"key":"ニ","text":"溶棒式及びコード式フレーム溶射には、酸化アルミニウム皮膜、酸化アルミニウム・酸化チタン皮膜、酸化クロム皮膜及び酸化ジルコニウム皮膜が用いられる。"},{"key":"ホ","text":"溶射皮膜の密着強さは、粉末式フレーム溶射よりもプラズマ溶射の方が大きい。"}],"answer":"ハ","answerText":"粉末式フレーム溶射には、酸化アルミニウム皮膜、酸化アルミニウム・酸化チタン皮膜、酸化クロム皮膜、酸化チタン皮膜及び酸化ジルコニウム皮膜が用いられる。","explanation":"JISのセラミック溶射皮膜の分類では、ハに挙げた粉末式フレーム溶射の皮膜材料の組合せが適切ではありません。","point":"溶射法ごとに適用できるセラミック皮膜材料が異なる。","problemImages":[],"choiceImages":[],"category":"加工技術"}</script>
<script type="application/json" id="qdata_R7-46">{"id":"R7-46","year":"R7","number":46,"question":"日本産業規格(JIS)における、 ファインセラミックスの機械的・熱的特性を表す用語に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"破壊じん性とは、材料の不安定亀裂進展開始を規定する応力拡大係数の値をいう。"},{"key":"ロ","text":"引張強さとは、引張荷重が負荷された試験片において、引張型破壊が巨視的に起こったときの最大引張り応力をいう。"},{"key":"ハ","text":"破壊エネルギーとは、極めて速い負荷速度で荷重を負荷したときに材料が示す破壊抵抗性をいう。"},{"key":"ニ","text":"圧縮強さとは、圧縮荷重が負荷された試験片において、圧縮型破壊が巨視的に起こったときの最大圧縮応力をいう。"},{"key":"ホ","text":"硬さとは、試験片表面にダイヤモンドで作った圧子を一定の荷重で圧入し、圧入荷重及び除荷後の圧痕の表面積又は投影面積から計算された、試験片の変形抵抗を表すための相対的尺度をいう。"}],"answer":"ハ","answerText":"破壊エネルギーとは、極めて速い負荷速度で荷重を負荷したときに材料が示す破壊抵抗性をいう。","explanation":"ハの説明は衝撃的な高速負荷に対する『耐衝撃性』に近い説明で、破壊エネルギーの定義ではありません。","point":"破壊じん性・強さ・破壊エネルギーを区別。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R7-47">{"id":"R7-47","year":"R7","number":47,"question":"日本産業規格(JIS)における、 繊維強化プラスチックに関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"繊維強化熱可塑性プラスチックとは、マトリックスとして熱可塑性樹脂を用いた繊維強化プラスチックをいう。"},{"key":"ロ","text":"層間ハイブリッドとは、一つの層の中に2種類以上の繊維が入っているものを積層したハイブリッド複合材料をいう。"},{"key":"ハ","text":"炭素繊維強化プラスチックとは、炭素繊維を強化材とし、熱硬化性樹脂又は熱可塑性樹脂をマトリックスとする複合材料をいう。"},{"key":"ニ","text":"ガラス繊維強化プラスチックとは、ガラス繊維を強化材とし、熱硬化性樹脂又は熱可塑性樹脂をマトリックスとする複合材料をいう。"},{"key":"ホ","text":"分散強化複合材料とは、粒子、フレークなどの微小形素材を分散させた複合材料をいう。"}],"answer":"ロ","answerText":"層間ハイブリッドとは、一つの層の中に2種類以上の繊維が入っているものを積層したハイブリッド複合材料をいう。","explanation":"層間ハイブリッドは、異なる種類の繊維を別々の層として積層する方式です。1つの層内に複数種の繊維を混ぜる説明とは異なります。","point":"層間＝層ごとに材料が異なる。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R7-48">{"id":"R7-48","year":"R7","number":48,"question":"材料に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"低炭素ステンレス鋼は、炭素含有率を0.3%以下とするなど、加工性の改善に加え、クロム炭化物の粒界への析出を抑えて粒界腐食性を改善したステンレス鋼をいう。"},{"key":"ロ","text":"析出硬化系ステンレス鋼は、アルミニウム、銅などの元素を添加し、 熱処理によってこれらの元素の化合物などを析出させて硬化する性質をもたせたステンレス鋼をいう。"},{"key":"ハ","text":"快削ステンレス鋼は、 硫黄、セレン、りん、鉛などの元素を添加して被削性を改善したステンレス鋼をいう。"},{"key":"ニ","text":"安定化ステンレス鋼は、チタン、ニオブ、ジルコニウム、又はそれらの組合せを少量添加し、あらかじめ鋼中の炭素と結合させ、クロム炭化物の析出による粒界腐食を抑制したステンレス鋼をいう。"},{"key":"ホ","text":"塗装ステンレス鋼板及び鋼帯は、冷間圧延ステンレス鋼板及び鋼帯に、耐久性のある合成樹脂塗料を焼き付けた鋼板及び鋼帯をいう。"}],"answer":"イ","answerText":"低炭素ステンレス鋼は、炭素含有率を0.3%以下とするなど、加工性の改善に加え、クロム炭化物の粒界への析出を抑えて粒界腐食性を改善したステンレス鋼をいう。","explanation":"低炭素ステンレス鋼の炭素量は代表的に0.03%以下です。イの0.3%以下は1桁大きく、粒界腐食対策としての低炭素化の説明として不適切です。","point":"Lグレードの目安＝C 0.03%以下。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R7-49">{"id":"R7-49","year":"R7","number":49,"question":"日本産業規格(JIS)における、真円度の評価方法に関する記述として、 誤っているものはどれか。","choices":[{"key":"イ","text":"最小二乗中心 LSC"},{"key":"ロ","text":"最小領域中心 MZC"},{"key":"ハ","text":"最小外接円中心 MCC"},{"key":"ニ","text":"最小実体公差方式 LMR"},{"key":"ホ","text":"最大内接円中心 MIC"}],"answer":"ニ","answerText":"最小実体公差方式 LMR","explanation":"LSC・MZC・MCC・MICは真円度評価の中心の求め方です。LMR（最小実体公差方式）はGPSの公差原則で、真円度中心の評価方法ではありません。","point":"真円度の4中心：LSC/MZC/MCC/MIC。","problemImages":[],"choiceImages":[],"category":"測定・検査"}</script>
<script type="application/json" id="qdata_R7-50">{"id":"R7-50","year":"R7","number":50,"question":"三次元測定機に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"対象物は、測定室にあらかじめ一定時間置き、室温(一般的に20℃)に慣らす。"},{"key":"ロ","text":"機種によっては、0.1μmのオーダーまで計測できるものがあるが、測定精度を求めるには、適切な使用と管理が欠かせない。"},{"key":"ハ","text":"使用時には、可動部が平行及び垂直に動くことを確認し、標準器などを用いて、 指示誤差がないことを確認する。"},{"key":"ニ","text":"対象物の自動測定及び測定データの記録ができるほか、各種の演算によって、 特殊な値を算出することも可能である。"},{"key":"ホ","text":"タッチプローブの場合は、 測定時に、 対象物への接触速度を気にせずに測定することができる。"}],"answer":"ホ","answerText":"タッチプローブの場合は、 測定時に、 対象物への接触速度を気にせずに測定することができる。","explanation":"タッチプローブは接触速度によってたわみ・衝撃・トリガ特性が変わるため、適切なプロービング速度で測る必要があります。","point":"CMMは温度・速度・プローブ校正が精度を左右。","problemImages":[],"choiceImages":[],"category":"測定・検査"}</script>

<script>
(function(){
var INDEX=[];
var CACHE={};
var queue=[];
var pos=0;
var selectedKey="";
var answered=false;
var correctCount=0;
var reviewMode=false;
var WRONG_KEY="finish_r5r7_wrong_ids_v1";

function byId(id){return document.getElementById(id);}
function text(v){return (v===null||v===undefined)?"":String(v);}
function esc(v){
  return text(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function br(v){return esc(v).replace(/\n/g,"<br>");}
function showError(msg){
  var box=byId("errorBox");
  box.style.display="block";
  box.innerHTML="<strong>エラー：</strong>"+esc(msg);
}
function loadWrongIds(){
  try{
    var raw=(window.localStorage)?window.localStorage.getItem(WRONG_KEY):null;
    var arr=raw?JSON.parse(raw):[];
    return Array.isArray(arr)?arr:[];
  }catch(e){return [];}
}
function saveWrongIds(arr){
  try{
    if(window.localStorage){window.localStorage.setItem(WRONG_KEY,JSON.stringify(arr));}
  }catch(e){}
}
function addWrongId(id){
  var arr=loadWrongIds();
  if(arr.indexOf(id)===-1){arr.push(id);saveWrongIds(arr);}
  updateReviewButton();
}
function removeWrongId(id){
  var arr=loadWrongIds(),out=[],i;
  for(i=0;i<arr.length;i++){if(arr[i]!==id){out.push(arr[i]);}}
  saveWrongIds(out);
  updateReviewButton();
}
function updateReviewButton(){
  var arr=loadWrongIds(),valid=[],i,j,exists;
  for(i=0;i<arr.length;i++){
    exists=false;
    for(j=0;j<INDEX.length;j++){if(INDEX[j].id===arr[i]){exists=true;break;}}
    if(exists){valid.push(arr[i]);}
  }
  if(valid.length!==arr.length){saveWrongIds(valid);}
  var btn=byId("reviewBtn"),count=byId("reviewCount"),clear=byId("clearWrongBtn");
  if(!btn||!count){return;}
  var eligible=INDEX.filter(function(item){return matchesFilters(item)&&valid.indexOf(item.id)!==-1;}).length;
  btn.disabled=(eligible===0);
  btn.innerHTML=eligible?"間違えた問題だけ復習（"+eligible+"問）":"間違えた問題だけ復習";
  count.innerHTML="選択条件の復習問題 "+eligible+"問（全履歴 "+valid.length+"問）";
  if(clear){clear.className=valid.length?"miniDanger":"miniDanger hidden";}
}

window.onerror=function(message,source,line){showError(text(message)+"（行 "+line+"）");return false;};

function loadQuestion(id){
  if(CACHE[id]){return CACHE[id];}
  var node=byId("qdata_"+id);
  if(!node){throw new Error("問題データが見つかりません: "+id);}
  var raw=node.textContent||node.innerText||"";
  if(!raw){throw new Error("問題データが空です: "+id);}
  var q=JSON.parse(raw);
  CACHE[id]=q;
  return q;
}

function init(){
  var node=byId("questionIndex");
  INDEX=JSON.parse(node.textContent||node.innerText||"[]");
  if(INDEX.length!==150){throw new Error("問題索引の読み込みに失敗しました。");}
  var categories=[];
  INDEX.forEach(function(item){if(categories.indexOf(item.category)===-1){categories.push(item.category);}});
  categories.forEach(function(category){
    var option=document.createElement("option");
    option.value=category;option.textContent=category;
    byId("categorySelect").appendChild(option);
  });
  updateFilters();
  updateRandomState();
  updateReviewButton();
}

window.updateRandomState=function(){
  byId("randomState").innerHTML=byId("randomCheck").checked?"ON":"OFF";
};

function selectedYears(){
  var a=[];
  if(byId("yearR5").checked){a.push("R5");}
  if(byId("yearR6").checked){a.push("R6");}
  if(byId("yearR7").checked){a.push("R7");}
  return a;
}


function matchesFilters(item){
  var category=byId("categorySelect").value;
  return selectedYears().indexOf(item.year)!==-1&&(!category||item.category===category);
}
window.updateFilters=function(){
  var years=selectedYears(),category=byId("categorySelect").value;
  var options=byId("categorySelect").options;
  for(var i=0;i<options.length;i++){
    var value=options[i].value;
    var count=INDEX.filter(function(item){return years.indexOf(item.year)!==-1&&(!value||item.category===value);}).length;
    options[i].textContent=(value||"すべての項目")+"（"+count+"問）";
  }
  var eligible=INDEX.filter(matchesFilters);
  var detail=years.map(function(year){
    return year+"："+eligible.filter(function(item){return item.year===year;}).length+"問";
  }).join(" ／ ");
  byId("readyText").textContent=years.length?
    (category||"すべての項目")+"｜出題 "+eligible.length+"問（"+detail+"）":
    "年度を1つ以上選択してください。";
  byId("startBtn").disabled=eligible.length===0;
  byId("errorBox").style.display="none";
  updateReviewButton();
};

function shuffle(a){
  var x=a.slice(0),i,j,t;
  for(i=x.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    t=x[i];x[i]=x[j];x[j]=t;
  }
  return x;
}

function buildQueue(){
  var years=selectedYears(),ids=[],i;
  if(years.length===0){throw new Error("年度を1つ以上選択してください。");}

  for(i=0;i<INDEX.length;i++){
    if(matchesFilters(INDEX[i])){
      ids.push(INDEX[i].id);
    }
  }

  if(ids.length===0){throw new Error("選択した条件に該当する問題がありません。");}
  if(byId("randomCheck").checked){
    ids=shuffle(ids);
  }else{
    ids.sort(function(a,b){
      var aa=a.split("-"),bb=b.split("-");
      var ya=parseInt(aa[0].substring(1),10),yb=parseInt(bb[0].substring(1),10);
      if(ya!==yb){return ya-yb;}
      return parseInt(aa[1],10)-parseInt(bb[1],10);
    });
  }
  return ids;
}

window.startQuiz=function(){
  try{
    reviewMode=false;
    queue=buildQueue();
    pos=0;
    correctCount=0;
    selectedKey="";
    answered=false;

    byId("setupView").className="card hidden";
    byId("finishView").className="card hidden";
    byId("quizView").className="card";

    renderQuestion();
    window.scrollTo(0,0);
  }catch(e){
    showError(e.message||e);
  }
};


window.startWrongReview=function(){
  try{
    var years=selectedYears();
    if(years.length===0){throw new Error("年度を1つ以上選択してください。");}
    var wrong=loadWrongIds(),ids=[],i,j,item;
    for(i=0;i<wrong.length;i++){
      for(j=0;j<INDEX.length;j++){
        item=INDEX[j];
        if(item.id===wrong[i] && matchesFilters(item)){
          ids.push(item.id);
          break;
        }
      }
    }
    if(ids.length===0){
      alert("選択した項目・年度には、復習対象の間違い問題がありません。");
      return;
    }
    reviewMode=true;
    queue=buildQueue().filter(function(id){return ids.indexOf(id)!==-1;});
    pos=0;correctCount=0;selectedKey="";answered=false;
    byId("setupView").className="card hidden";
    byId("finishView").className="card hidden";
    byId("quizView").className="card";
    renderQuestion();
    window.scrollTo(0,0);
  }catch(e){showError(e.message||e);}
};
window.clearWrongHistory=function(){
  if(confirm("間違えた問題の履歴をすべてリセットしますか？")){
    saveWrongIds([]);
    updateReviewButton();
  }
};

function renderFigures(targetId,images,label){
  var html="",i;
  for(i=0;i<images.length;i++){
    html+='<div class="figure"><small>'+esc(label)+'</small><img src="'+images[i]+'" alt="'+esc(label)+'"></div>';
  }
  byId(targetId).innerHTML=html;
}

function renderQuestion(){
  if(pos<0||pos>=queue.length){throw new Error("出題位置が正しくありません。");}

  var q=loadQuestion(queue[pos]);
  selectedKey="";
  answered=false;

  byId("yearBadge").innerHTML=esc(q.year);
  byId("categoryBadge").textContent=q.category;
  byId("numberBadge").innerHTML=(reviewMode?"復習｜":"")+"問"+q.number;
  byId("counter").innerHTML=(pos+1)+" / "+queue.length;
  byId("progressBar").style.width=Math.round((pos/queue.length)*100)+"%";
  byId("questionText").innerHTML=br(q.question);

  renderFigures("problemFigures",q.problemImages,"問題図");
  renderFigures("choiceFigures",q.choiceImages,"選択肢図");

  var html="",i,key,value;
  for(i=0;i<q.choices.length;i++){
    key=q.choices[i].key;
    value=q.choices[i].text;
    html+='<button type="button" class="choice" id="choice_'+key+'" onclick="chooseAnswer(\''+key+'\')">';
    html+='<span class="key">'+key+'</span><span class="ctext">'+br(value)+'</span></button>';
  }
  byId("choiceArea").innerHTML=html;

  byId("nextBtn").className="btn main hidden";
  byId("feedbackBox").className="feedback hidden";
  byId("feedbackBox").innerHTML="";
}

window.chooseAnswer=function(key){
  if(answered){return;}
  selectedKey=key;

  var q=loadQuestion(queue[pos]),i;
  for(i=0;i<q.choices.length;i++){
    byId("choice_"+q.choices[i].key).className="choice";
  }
  byId("choice_"+key).className="choice selected";

  // 選択した瞬間に正誤判定
  judgeAnswer();
};

function judgeAnswer(){
  if(answered||!selectedKey){return;}

  answered=true;
  var q=loadQuestion(queue[pos]);
  var correct=(selectedKey===q.answer);
  if(correct){
    correctCount++;
    removeWrongId(q.id);
  }else{
    addWrongId(q.id);
  }

  var i,key,btn;
  for(i=0;i<q.choices.length;i++){
    key=q.choices[i].key;
    btn=byId("choice_"+key);

    if(key===q.answer){
      btn.className="choice correct";
    }else if(key===selectedKey&&!correct){
      btn.className="choice wrong";
    }else{
      btn.className="choice";
    }
    btn.disabled=true;
  }

  var html='';
  html+='<div class="fhead '+(correct?'good':'bad')+'">'+(correct?'○ 正解':'× 不正解')+'</div>';
  html+='<div class="fbody">';
  html+='<div class="answer">正解：'+esc(q.answer)+'　'+br(q.answerText)+'</div>';
  html+='<div class="explain"><strong>解説</strong><br>'+br(q.explanation)+'</div>';
  html+='<div class="point"><strong>試験ポイント</strong><br>'+br(q.point)+'</div>';
  html+='</div>';

  byId("feedbackBox").innerHTML=html;
  byId("feedbackBox").className="feedback";

  byId("nextBtn").className="btn main";
  byId("nextBtn").innerHTML=(pos===queue.length-1)?"結果を見る":"次の問題へ";
  byId("progressBar").style.width=Math.round(((pos+1)/queue.length)*100)+"%";
}
window.judgeAnswer=judgeAnswer;

window.nextQuestion=function(){
  if(pos<queue.length-1){
    pos++;
    renderQuestion();
    window.scrollTo(0,0);
  }else{
    finishQuiz();
  }
};

function finishQuiz(){
  var total=queue.length;
  var percent=total?Math.round((correctCount/total)*100):0;

  byId("quizView").className="card hidden";
  byId("finishView").className="card";
  byId("finishScore").innerHTML=correctCount+" / "+total;
  byId("finishPercent").innerHTML=reviewMode?("復習結果｜"+correctCount+"問正解 / "+total+"問"):("正答率 "+percent+"%");
  window.scrollTo(0,0);
}

window.restartSame=function(){
  if(byId("randomCheck").checked){queue=shuffle(queue);}
  pos=0;
  correctCount=0;
  byId("finishView").className="card hidden";
  byId("quizView").className="card";
  renderQuestion();
  window.scrollTo(0,0);
};

window.stopQuiz=function(){
  byId("quizView").className="card hidden";
  byId("finishView").className="card hidden";
  byId("setupView").className="card";
  updateReviewButton();
  window.scrollTo(0,0);
};

try{
  init();
}catch(e){
  showError(e.message||e);
  byId("readyText").innerHTML="読み込みエラー";
}
})();
</script>
</body>
</html>
