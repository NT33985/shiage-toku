<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>特級 仕上げ R5-R7 1問1答</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;background:#f4f6f8;color:#1f2933;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",Meiryo,sans-serif}
body{min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:10px 9px 60px}
.hero{background:linear-gradient(135deg,#12344f,#1c5279);color:white;border-radius:18px;padding:19px 16px;margin-bottom:11px}
.hero h1{font-size:22px;margin:0 0 6px}.hero p{font-size:13px;line-height:1.6;color:#d8e7f0;margin:0}
.card{background:white;border:1px solid #dfe6eb;border-radius:16px;padding:15px;margin-bottom:11px;box-shadow:0 5px 16px rgba(20,48,67,.06)}
.title{font-size:18px;font-weight:900;color:#173c5a;margin:0 0 14px}
.label{font-size:13px;font-weight:800;color:#5a6670;margin-bottom:8px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pick{position:relative}.pick input{position:absolute;opacity:0}
.pick span{display:block;padding:9px 14px;border:1px solid #cbd6dd;border-radius:999px;font-size:13px;font-weight:900;color:#52606a;background:white}
.pick input:checked+span{background:#173c5a;color:white;border-color:#173c5a}
.setting{border-top:1px solid #edf1f3;margin-top:14px;padding-top:14px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px}.toggle input{width:23px;height:23px}.state{font-size:12px;color:#087b70;font-weight:900}
.ready{font-size:13px;color:#137953;font-weight:900;margin-bottom:10px}
.note{font-size:12px;color:#6d7880;line-height:1.55;margin-top:8px}
.btn{border:0;border-radius:13px;padding:13px 16px;font-size:15px;font-weight:900;cursor:pointer}
.main{background:#0a8980;color:white}.main:disabled{background:#a9b7c0}.sub{background:#edf2f5;color:#29465b}.full{width:100%}
.hidden{display:none!important}.error{display:none;background:#fff0ef;border:1px solid #ecc5c0;color:#a33d36;border-radius:12px;padding:11px;margin-bottom:10px;font-size:13px;line-height:1.55}
.qtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.badges{display:flex;gap:6px;flex-wrap:wrap}.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:900;background:#edf3f7;color:#29475b}.year{background:#e6f6f2;color:#08756c}
.counter{font-size:12px;color:#68747d;font-weight:800}
.track{height:7px;background:#e5ebef;border-radius:999px;overflow:hidden;margin-bottom:16px}.bar{height:100%;background:#0a8980;width:0}
.question{font-size:18px;font-weight:850;line-height:1.75;white-space:pre-wrap;margin-bottom:14px}
.figures{display:grid;gap:9px;margin-bottom:14px}.figure{border:1px solid #d8e1e7;border-radius:12px;padding:8px;overflow:auto}.figure small{display:block;font-size:11px;font-weight:800;color:#6a7780;margin-bottom:4px}.figure img{display:block;max-width:100%;height:auto;margin:auto}
.choices{display:grid;gap:9px}
.choice{width:100%;display:grid;grid-template-columns:34px 1fr;gap:9px;text-align:left;border:1px solid #ccd8df;border-radius:13px;background:white;padding:12px;color:#1f2933}
.key{width:29px;height:29px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#edf2f5;color:#51606b;font-weight:900}
.ctext{font-size:14px;line-height:1.65;white-space:pre-wrap;padding-top:2px}
.choice.selected{border:2px solid #357db3;background:#eef7fc;padding:11px}.choice.selected .key{background:#357db3;color:white}
.choice.correct{border:2px solid #16845a;background:#eaf7f1;padding:11px}.choice.correct .key{background:#16845a;color:white}
.choice.wrong{border:2px solid #c64a41;background:#fff0ef;padding:11px}.choice.wrong .key{background:#c64a41;color:white}
.actions{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.feedback{border:1px solid #dce4e9;border-radius:14px;overflow:hidden;margin-top:14px}.fhead{padding:11px 13px;font-size:17px;font-weight:900}.good{background:#eaf7f1;color:#14764f}.bad{background:#fff0ef;color:#b13f37}.fbody{padding:13px}
.answer{font-weight:900;color:#173c5a;line-height:1.65}.explain{background:#f7f9fa;border-radius:11px;padding:11px;line-height:1.7;margin-top:9px;white-space:pre-wrap}.point{background:#fff8e5;border:1px solid #efdfab;border-radius:11px;padding:11px;line-height:1.7;margin-top:9px;color:#6b520d;white-space:pre-wrap}
.done{text-align:center}.done strong{display:block;font-size:34px;color:#173c5a;margin:6px 0}.done span{font-size:13px;color:#6d7880}
@media(max-width:600px){.app{padding:8px 7px 50px}.hero{border-radius:15px;padding:17px 14px}.hero h1{font-size:20px}.card{border-radius:14px;padding:14px}.question{font-size:16px}.ctext{font-size:13px}}

.reviewBox{margin-top:10px;padding-top:12px;border-top:1px solid #edf1f3}
.reviewBtn{background:#fff4df;color:#7b5600;border:1px solid #ecd7a0}
.reviewBtn:disabled{background:#f2f3f4;color:#9aa4aa;border-color:#e0e4e7}
.reviewCount{font-size:12px;font-weight:900;color:#8a6300;margin-top:7px;text-align:center}
.miniDanger{margin-top:8px;background:transparent;color:#8b5f5a;border:0;font-size:12px;font-weight:800;text-decoration:underline;padding:5px}
select{width:100%;min-height:46px;padding:10px;border:1px solid #cbd6dd;border-radius:10px;background:#fff;color:#173c5a;font:inherit;font-size:16px}
.pick input:focus-visible+span,select:focus-visible{outline:3px solid #357db3;outline-offset:2px}
.counter{flex-shrink:0}.badges{min-width:0}.ctext{min-width:0;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>特級 仕上げ｜1問1答</h1>
    <p>R5・R6・R7の過去問を1問ずつ学習できます。選択肢をタップすると、その場で正誤と解説を表示します。</p>
  </div>

  <div id="errorBox" class="error"></div>

  <div id="setupView" class="card">
    <div class="title">出題設定</div>

    <div class="label"><label for="categorySelect">項目</label></div>
    <select id="categorySelect" onchange="updateFilters()"><option value="">すべての項目</option></select>
    <div class="note">選んだ項目を、チェックした年度からまとめて出題します。項目は問題内容に基づく学習用の分類です。</div>
    <div class="setting">
    <div class="label">年度（複数選択可）</div>
    <div class="row">
      <label class="pick"><input id="yearR5" onchange="updateFilters()" type="checkbox" checked><span>令和5年</span></label>
      <label class="pick"><input id="yearR6" onchange="updateFilters()" type="checkbox" checked><span>令和6年</span></label>
      <label class="pick"><input id="yearR7" onchange="updateFilters()" type="checkbox" checked><span>令和7年</span></label>
    </div>

    </div>
    <div class="setting">
      <div class="toggle">
        <div>
          <div class="label" style="margin:0">ランダム出題</div>
          <div id="randomState" class="state">ON</div>
        </div>
        <input id="randomCheck" type="checkbox" checked onchange="updateRandomState()">
      </div>
    </div>

    <div class="setting">
      <div id="readyText" class="ready" aria-live="polite">準備中…</div>
      <button type="button" id="startBtn" class="btn main full" onclick="startQuiz()">演習をスタート</button>
      <div class="note">スタート後は1問ずつ出題します。選択肢を選ぶとすぐに正誤判定され、「次の問題へ」で次の1問へ進みます。</div>
      <div class="reviewBox">
        <button type="button" id="reviewBtn" class="btn reviewBtn full" onclick="startWrongReview()" disabled>間違えた問題だけ復習</button>
        <div id="reviewCount" class="reviewCount">復習問題 0問</div>
        <div style="text-align:center"><button type="button" id="clearWrongBtn" class="miniDanger hidden" onclick="clearWrongHistory()">間違い履歴をリセット</button></div>
      </div>
    </div>
  </div>

  <div id="quizView" class="card hidden">
    <div class="qtop">
      <div class="badges"><span id="yearBadge" class="badge year"></span><span id="numberBadge" class="badge"></span><span id="categoryBadge" class="badge"></span></div>
      <div id="counter" class="counter"></div>
    </div>
    <div class="track"><div id="progressBar" class="bar"></div></div>

    <div id="questionText" class="question"></div>
    <div id="problemFigures" class="figures"></div>
    <div id="choiceFigures" class="figures"></div>
    <div id="choiceArea" class="choices"></div>

    <div class="actions">
      <button type="button" class="btn sub" onclick="stopQuiz()">⌂ ホームへ</button>
      <button type="button" id="nextBtn" class="btn main hidden" onclick="nextQuestion()">次の問題へ</button>
    </div>

    <div id="feedbackBox" class="feedback hidden"></div>
  </div>

  <div id="finishView" class="card hidden">
    <div class="done">
      <div class="title">選択した問題を一周しました</div>
      <strong id="finishScore">0 / 0</strong>
      <span id="finishPercent">正答率 0%</span>
    </div>
    <div class="actions" style="justify-content:center;margin-top:18px">
      <button type="button" class="btn sub" onclick="restartSame()">もう一周</button>
      <button type="button" class="btn main" onclick="stopQuiz()">⌂ ホームへ</button>
    </div>
  </div>
</div>

<script type="application/json" id="qdata_R5-01">{"id":"R5-01","year":"R5","number":1,"question":"一般的な生産活動の流れに関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"資材計画は、生産に必要な品目、その所要量、品質、必要時期などを決める活動である。"},{"key":"ロ","text":"作業指示は、手配計画で生産に必要な人員、機械設備、資材が揃った後、実際の作業に移るように指示する活動である。"},{"key":"ハ","text":"検査には、購入品・外注部品の受入検査、製造・運搬工程の仕掛品検査、完成した製品の製品検査がある。"},{"key":"ニ","text":"資材在庫は、資材供給のリードタイムの変動、予測と需要の差異を吸収するために置かれる。"},{"key":"ホ","text":"出荷は、受注生産の場合には、市場の需要に合わせてあらかじめ生産された製品在庫から行われる。"}],"answer":"ホ","answerText":"出荷は、受注生産の場合には、市場の需要に合わせてあらかじめ生産された製品在庫から行われる。","explanation":"ホは見込み生産の説明です。受注生産は顧客の注文・仕様を受けてから生産し、その注文に対応して出荷するのが基本です。","point":"受注生産＝注文起点、見込み生産＝需要予測起点。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-02">{"id":"R5-02","year":"R5","number":2,"question":"生産形態及び生産方式に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"プロセス生産では、原材料に対する化学的・物理的処理を通じて、最終的に様々な製品が産出される。"},{"key":"ロ","text":"見込み生産では、製品の差別化により市場での優位を図るなど、需要の獲得を図る活動が重要である。"},{"key":"ハ","text":"受注生産では、顧客が定めた仕様の製品を生産者が生産する。"},{"key":"ニ","text":"ストックポイント型生産方式では、顧客の注文に基づいて部品や半製品を作り、最終的には見込みで生産を行う。"},{"key":"ホ","text":"ロット生産では、品種ごとに生産量をまとめて、複数の製品を交互に生産する。"}],"answer":"ニ","answerText":"ストックポイント型生産方式では、顧客の注文に基づいて部品や半製品を作り、最終的には見込みで生産を行う。","explanation":"ストックポイント型では、共通部品・半製品までは見込みで準備し、受注後に最終仕様へ仕上げます。ニはこの順序が逆です。","point":"ストックポイント＝途中まで見込み、受注後に最終組立。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-03">{"id":"R5-03","year":"R5","number":3,"question":"生産統制に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"作業指示では、次期の生産予定の全品目について、着手日程と完了日程を決める。"},{"key":"ロ","text":"作業指示で用いられる帳票として、作業票、出庫票、移動票、検査票などがある。"},{"key":"ハ","text":"計画と実績の差異の測定では、作業者の動きや機械の動作を分析し、定められた動きをしていない状況があれば、修正することが活動の中心となる。"},{"key":"ニ","text":"計画と実績の差異の処置では、計画と実績の差に対して、それを生じさせた原因を追究し、当期の中だけで対応して、次期の計画に影響させないことが要求される。"},{"key":"ホ","text":"遅延対策において、遅延の回復を行う方法として、日程計画にゆとりを持たせる方法がある。"}],"answer":"ロ","answerText":"作業指示で用いられる帳票として、作業票、出庫票、移動票、検査票などがある。","explanation":"ロの作業票・出庫票・移動票・検査票は、作業指示・差立てで現場へ具体的に指示する代表的な帳票です。","point":"生産統制＝指示→進捗確認→差異への処置。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-04">{"id":"R5-04","year":"R5","number":4,"question":"日程計画の目的に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"工程の稼働率の向上"},{"key":"ロ","text":"短納期化への対応"},{"key":"ハ","text":"作業方法の改善"},{"key":"ニ","text":"納期見積の正確化"},{"key":"ホ","text":"受注変動に対する負荷量変動の抑制"}],"answer":"ハ","answerText":"作業方法の改善","explanation":"日程計画は納期・負荷・稼働を時間軸で整える計画です。作業方法そのものの改善は作業研究・方法研究の領域です。","point":"日程計画と作業改善を区別する。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-05">{"id":"R5-05","year":"R5","number":5,"question":"日本産業規格(JIS)Z8141(生産管理用語)における、現品管理に関する記述中の（　）内に当てはまる語句として、正しいものはどれか。\n\n現品管理とは、「資材、仕掛品、製品などの物について（　）又は停滞・保管の状況を管理する活動」である。","choices":[{"key":"イ","text":"記帳・転載"},{"key":"ロ","text":"包装・梱包"},{"key":"ハ","text":"形状・特性"},{"key":"ニ","text":"検査・検収"},{"key":"ホ","text":"運搬・移動"}],"answer":"ホ","answerText":"運搬・移動","explanation":"現品管理は、資材・仕掛品・製品の運搬・移動、停滞、保管など『物の流れと所在』を管理する活動です。","point":"現品管理＝物の数量・所在・移動・保管。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-06">{"id":"R5-06","year":"R5","number":6,"question":"進度管理(進捗管理)に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"進度管理の目的の一つに、手待ち時間を削減する活動がある。"},{"key":"ロ","text":"進度管理は、納期管理とも言われる。"},{"key":"ハ","text":"進度管理では、遅延があれば対策をとる。"},{"key":"ニ","text":"進度管理には、ある期間にどれだけ生産したかを見る数量の確認がある。"},{"key":"ホ","text":"進度の調査結果は、ガントチャート式進度表などにまとめられる。"}],"answer":"イ","answerText":"進度管理の目的の一つに、手待ち時間を削減する活動がある。","explanation":"進度管理は計画に対する仕事の進み具合を把握し、遅延を是正する活動です。手待ち時間削減そのものは主目的ではありません。","point":"進度管理＝予定対実績＋遅延対策。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-07">{"id":"R5-07","year":"R5","number":7,"question":"余力管理に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"余力管理の主な活動とは、日々の作業の進行状況を把握して調整することである。"},{"key":"ロ","text":"余力とは、生産開始から生産完了までに含まれる余裕時間である。"},{"key":"ハ","text":"余力比率とは、一定期間に負荷されている仕事量と工程の生産能力の比である。"},{"key":"ニ","text":"余力とは、受注した仕事量全体を工場全体の生産能力で検討したものである。"},{"key":"ホ","text":"余力管理は、ある期間の作業の負荷状態と能力を把握し、その期間での余力を均衡させることをねらいとする。"}],"answer":"ホ","answerText":"余力管理は、ある期間の作業の負荷状態と能力を把握し、その期間での余力を均衡させることをねらいとする。","explanation":"余力管理は工程の能力と負荷を比較し、過負荷・遊休をできるだけ均衡させる活動です。","point":"余力＝能力－負荷。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-08">{"id":"R5-08","year":"R5","number":8,"question":"在庫管理に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"安全在庫とは、需要変動を吸収する目的で設置される在庫をいう。"},{"key":"ロ","text":"納品不足が予測される場合の資材在庫は、緩衝(バッファ)在庫の一種である。"},{"key":"ハ","text":"ロット生産では、工程間に在庫が発生し、その管理が重要となる。"},{"key":"ニ","text":"発注点方式は、定期的に発注する方法である。"},{"key":"ホ","text":"在庫は、物による緩衝(バッファ)のうち一般的なものである。"}],"answer":"ニ","answerText":"発注点方式は、定期的に発注する方法である。","explanation":"発注点方式は在庫量が設定した発注点まで減った時点で発注する方式で、定期発注方式とは異なります。","point":"発注点方式＝在庫量基準、定期発注＝時間基準。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R5-09">{"id":"R5-09","year":"R5","number":9,"question":"作業方法を標準化することにより期待できる効果として、適切でないものはどれか。","choices":[{"key":"イ","text":"作業の日程計画や実績評価の資料として利用することができる。"},{"key":"ロ","text":"作業員の訓練や指導の拠り所となり、技術の向上に役立つ。"},{"key":"ハ","text":"安全な作業の維持と向上に役立つ。"},{"key":"ニ","text":"必要な作業員数や機械台数の算出基準に用いることができる。"},{"key":"ホ","text":"同じ結果が得られる作業に対して、作業員別の作業方法を設定することができる。"}],"answer":"ホ","answerText":"同じ結果が得られる作業に対して、作業員別の作業方法を設定することができる。","explanation":"標準化は同じ成果を安定して出すために作業方法を統一する考え方です。作業者ごとに別々の方法を標準とするのは趣旨に反します。","point":"標準作業＝安全・品質・時間の基準。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R5-10">{"id":"R5-10","year":"R5","number":10,"question":"作業管理の方法研究に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"工程分析は、製造過程を工程別に分け、○、□、▽等の記号で図示する手法である。"},{"key":"ロ","text":"流れ線図は、横方向に加工工程、縦方向に対象品をとり、簡略工程分析表に基づいて作成する。"},{"key":"ハ","text":"運搬工程分析は、作業者工程分析から分化したもので、作業者の作業内容を記号化して分析する手法である。"},{"key":"ニ","text":"サーブリッグ分析は、歩行などの体全体の動きを分析できる。"},{"key":"ホ","text":"稼働分析における瞬間観測法は、分析の対象としている作業の時間を直接、測定できる。"}],"answer":"イ","answerText":"工程分析は、製造過程を工程別に分け、○、□、▽等の記号で図示する手法である。","explanation":"工程分析は加工・運搬・検査・停滞などを工程記号で表し、工程全体の流れを分析する方法です。","point":"工程分析は『工程記号で流れを見る』。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R5-11">{"id":"R5-11","year":"R5","number":11,"question":"次の記述に当てはまる標準時間の設定手法として、適切なものはどれか。\n\n作業方法を基本動作に分解し、その動作の性質と条件に応じて、あらかじめ定められた時間値(時間標準値)を当てはめる方法。","choices":[{"key":"イ","text":"PTS法"},{"key":"ロ","text":"ストップウォッチ法"},{"key":"ハ","text":"連合作業分析"},{"key":"ニ","text":"瞬間観測法"},{"key":"ホ","text":"ビデオ分析"}],"answer":"イ","answerText":"PTS法","explanation":"PTS法は作業を基本動作に分解し、あらかじめ設定された時間値を当てはめて標準時間を求めます。","point":"PTS＝Predetermined Time Standards。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R5-12">{"id":"R5-12","year":"R5","number":12,"question":"作業改善を行うためのアイディア発想の技法として、適切でないものはどれか。","choices":[{"key":"イ","text":"5W1H法"},{"key":"ロ","text":"ブレーン・ストーミング法"},{"key":"ハ","text":"WF法"},{"key":"ニ","text":"KJ法"},{"key":"ホ","text":"NM法"}],"answer":"ハ","answerText":"WF法","explanation":"WF法（Work Factor法）はPTSの一種で、主に標準時間設定の手法です。アイディア発想法ではありません。","point":"発想法：5W1H、BS、KJ、NMなど。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R5-13">{"id":"R5-13","year":"R5","number":13,"question":"品質管理に関する記述中の（　）内に当てはまる語句の組合せとして、適切なものはどれか。\n\n当初の品質管理では、（①）で不良品を出さないような管理に重点がおかれていたが、最近では、（②）の要求に合った製品の品質を確実に実現できるように、（③）部門を含めた全社的な活動としての管理が重視されている。ものづくりでは、（④）収益のみでなく、（②）の満足や信頼による長期的な利益を確保するためには、品質の確保が重要である。また、企業の永続的な発展のためには、計画－実施－チェック－（⑤）を繰り返して、良い管理をできるようにすることが大切である。","choices":[{"key":"イ","text":"①検査／②設計／③品質保証／④営業／⑤品質向上"},{"key":"ロ","text":"①顧客／②営業／③全社的／④短期的な／⑤是正処置"},{"key":"ハ","text":"①生産現場／②顧客／③設計／④営業／⑤品質向上"},{"key":"ニ","text":"①顧客／②設計／③品質保証／④営業／⑤品質向上"},{"key":"ホ","text":"①生産現場／②顧客／③設計／④短期的な／⑤是正処置"}],"answer":"ホ","answerText":"①生産現場／②顧客／③設計／④短期的な／⑤是正処置","explanation":"品質管理は生産現場だけでなく設計なども含む全社活動へ発展し、顧客要求・長期的信頼を重視します。PDCAではCheckの次に是正・改善へつなげます。","point":"品質は顧客起点、全社でPDCA。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R5-14">{"id":"R5-14","year":"R5","number":14,"question":"日本産業規格(JIS)Q9000及びQ9001に記載されている品質マネジメントの原則に、合致していないものはどれか。","choices":[{"key":"イ","text":"顧客重視"},{"key":"ロ","text":"改善"},{"key":"ハ","text":"プロセスアプローチ"},{"key":"ニ","text":"自主的活動"},{"key":"ホ","text":"リーダーシップ"}],"answer":"ニ","answerText":"自主的活動","explanation":"ISO 9000系の品質マネジメント原則には顧客重視、リーダーシップ、人々の積極的参加、プロセスアプローチ、改善などがあります。『自主的活動』は原則名ではありません。","point":"QMSの7原則を整理する。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R5-15">{"id":"R5-15","year":"R5","number":15,"question":"検定に関する記述中の（　）内に当てはまる語句の組合せとして、適切なものはどれか。\n\n検定の際に犯す“誤り”には、次の2種が考えられる。\n第1種の誤り：帰無仮説が（①）ときに、これを（②）誤り。\n第2種の誤り：帰無仮説が（③）ときに、これを（④）誤り。\n前者は、抜取検査における生産者危険に対応し、後者は、（⑤）危険に対応する。","choices":[{"key":"イ","text":"①正しい／②棄却する／③正しくない／④棄却しない／⑤購入者"},{"key":"ロ","text":"①正しくない／②棄却しない／③正しい／④棄却する／⑤購入者"},{"key":"ハ","text":"①正しい／②棄却する／③正しくない／④棄却しない／⑤消費者"},{"key":"ニ","text":"①正しくない／②棄却する／③正しい／④棄却しない／⑤消費者"},{"key":"ホ","text":"①正しい／②棄却しない／③正しくない／④棄却する／⑤購入者"}],"answer":"ハ","answerText":"①正しい／②棄却する／③正しくない／④棄却しない／⑤消費者","explanation":"第1種の誤りは正しい帰無仮説を棄却する誤り（α）で生産者危険、第2種は誤った帰無仮説を棄却しない誤り（β）で消費者危険に対応します。","point":"第1種＝α＝生産者危険、第2種＝β＝消費者危険。","problemImages":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAx0AAADTCAYAAADkk37KAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAP+lSURBVHhe7L15VFtXlu//ZZAQIEDMYgYbjI2ZjI0nguchjk0qiZ05rqpXdlWlUp2uTr2u7l7Vq94v3a9qvX5rvZV+9bpSXZV0dSpjJU7ieLaxMfNgEIOYBBqAK4SE0BVIIHQZBOL3x9O9Dw2A8BBP57PWXcu+k4Tuvufs7z777OOzsLCwAAKBQCAQCAQCgUC4R/i67iAQCAQCgUAgEAiEu4kPGekg3AlWqxXDw8Po6+vD6OgowsLCEBQUhNnZWYyOjiIuLo7bwsLCXC8nEFaEtTF2Gx8fBwBER0cjOTkZ0dHRSEpKcr2MQFgVDMNAp9NhYmKC20dsi0AgEO4eRHQQbhuapnHr1i1QFIXx8XFMTEwgJiYG4eHhYBgGGo0GiYmJ8PPzQ2BgILZu3Yrs7GzX2xAIS8LamEwmw/z8PBiGgcFgAACkpqZCLBZjZmYGycnJiIqKwvr164m4JawKmqbR29sLo9EIvV7P2RcW2djU1BQ2b95MBAjhtmAFLRuci4uLw+zsLAYHB0nw5DGFpmloNBru/0FBQY9FcJaIDsJtIZPJUFdXh5mZGYjFYhQXFyM2Ntb1NJjNZjQ2NqK8vByBgYE4ceIEER6EFWEYBu3t7ejq6sLMzAwEAgG2bduGnJwcp/MoikJNTQ0GBgYwNzeHwsJC7Nq165FvuAl3DmtjjY2NYBgGMTExHtswiqKg1+uRkpKCtLQ0bN26ldgXwSsYhoFKpUJnZyfGxsa44Ny6deswNTWFzs5OREdHIzo6GnNzc8jLyyP29QjD2oNGo4HBYMDg4CB3TCQSYd26dRAKheDz+Y9sAI2IDsKqoSgKX3zxBex2O37wgx8gNjbWSbVbrVaEh4c7iQuKonDt2jUwDINDhw4R4UFYEqvVipqaGly5cgXr16/H8ePHERsby6VZsekviyNDrLjt6urCunXriPAgLAvDMGhubsaNGzcQGBiIkpISTtDSNM1Fo1kbMpvNKC0tRUtLC4qLi4l9EVaEYRhUV1ejrKwMQUFByM3N9RicM5vNkMvlaGpqgkajIfb1iKJWq1FbW4v+/n7YbDYkJye72QIA6HQ6aLVapKamYuPGjY+c+CCig7AqKIpCaWkpeDwejh49yr00FEWhs7MTMpkM <script type="application/json" id="qdata_R5-16">{"id":"R5-16","year":"R5","number":16,"question":"QC七つ道具の一つとして、品質特性(結果)と、その特性に影響を与えていると思われる要因(原因)との関係を図で表現したもので、魚の骨の形状に似ているため、フィッシュボーン・チャートと呼ばれることがあるものはどれか。","choices":[{"key":"イ","text":"管理図"},{"key":"ロ","text":"特性要因図"},{"key":"ハ","text":"連関図"},{"key":"ニ","text":"系統図"},{"key":"ホ","text":"親和図"}],"answer":"ロ","answerText":"特性要因図","explanation":"品質特性という結果と、それに影響する原因候補を魚の骨状に整理するのが特性要因図です。","point":"フィッシュボーン＝特性要因図。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R5-17">{"id":"R5-17","year":"R5","number":17,"question":"管理図における管理限界線の意味として、適切なものはどれか。","choices":[{"key":"イ","text":"管理限界線は、工程が安定状態にあれば、全ての点が内側に入る範囲を表している。"},{"key":"ロ","text":"管理限界線は規格幅を表しており、個々の製品の合格や不合格を判定するために用いられる。"},{"key":"ハ","text":"管理限界線は、過去のデータにおける標準偏差の2倍の範囲を表している。"},{"key":"ニ","text":"工程が安定状態でも、約0.3%の確率で点が管理限界線の外に出ることがある。"},{"key":"ホ","text":"管理図では、工程が安定状態にない場合、それを見逃す確率が約0.3%となるように、管理限界線が引かれている。"}],"answer":"ニ","answerText":"工程が安定状態でも、約0.3%の確率で点が管理限界線の外に出ることがある。","explanation":"通常のシューハート管理図は中心線から±3σ程度に管理限界を置くため、安定工程でも約0.27%（約0.3%）は限界外となり得ます。","point":"管理限界≠規格限界。±3σを覚える。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R5-18">{"id":"R5-18","year":"R5","number":18,"question":"日本産業規格(JIS)Z9002(計数規準型一回抜取検査)で用いられる用語の説明(定義)として、誤っているものはどれか。","choices":[{"key":"イ","text":"検査ロット：検査の対象となるひとまとめの品物の集まり。"},{"key":"ロ","text":"検査単位：検査の目的のために選ぶ単位体または単位量。"},{"key":"ハ","text":"ロットの大きさ：ロット内の検査単位の割合。"},{"key":"ニ","text":"試料：ロットから抜き取られる検査単位の集まり。"},{"key":"ホ","text":"試料の大きさ：試料中の検査単位の数。"}],"answer":"ハ","answerText":"ロットの大きさ：ロット内の検査単位の割合。","explanation":"ロットの大きさはロットに含まれる検査単位の『数』です。割合ではありません。","point":"ロットサイズ＝個数、試料サイズ＝抜取個数。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R5-19">{"id":"R5-19","year":"R5","number":19,"question":"原価管理における原価維持活動に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"標準となる基本的な生産方法を決定する。"},{"key":"ロ","text":"生産業務に基づき実際原価を算定する。"},{"key":"ハ","text":"標準原価と実際原価の差異分析を行う。"},{"key":"ニ","text":"開発・設計段階で原価の目標を設定する。"},{"key":"ホ","text":"日常業務の問題点を改善する。"}],"answer":"ニ","answerText":"開発・設計段階で原価の目標を設定する。","explanation":"開発・設計段階で目標原価を設定するのは原価企画です。原価維持は標準原価を守るために実績把握・差異分析・日常改善を行います。","point":"原価企画＝開発設計、原価維持＝量産段階。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R5-20">{"id":"R5-20","year":"R5","number":20,"question":"製造原価の構成を示すものとして、適切でないものはどれか。","choices":[{"key":"イ","text":"製造原価＝材料費＋労務費＋経費"},{"key":"ロ","text":"製造原価＝総原価－外注費"},{"key":"ハ","text":"製造原価＝製造直接費＋製造間接費"},{"key":"ニ","text":"製造原価＝製造直接費＋間接材料費＋間接労務費＋間接経費"},{"key":"ホ","text":"製造原価＝直接材料費＋直接労務費＋直接経費＋製造間接費"}],"answer":"ロ","answerText":"製造原価＝総原価－外注費","explanation":"総原価は製造原価に販売費・一般管理費などを加えたものです。したがって『総原価－外注費＝製造原価』とはなりません。","point":"製造原価＝材料費＋労務費＋経費。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R5-21">{"id":"R5-21","year":"R5","number":21,"question":"実際の生産量と損益分岐点の生産量を比較し、操業度の位置を測る指標として用いられるものはどれか。","choices":[{"key":"イ","text":"スキャッターチャート法"},{"key":"ロ","text":"安全余裕率"},{"key":"ハ","text":"価値指数"},{"key":"ニ","text":"原価効率性"},{"key":"ホ","text":"能率差異"}],"answer":"ロ","answerText":"安全余裕率","explanation":"安全余裕率は実際の売上・生産水準が損益分岐点をどれだけ上回っているかを見る指標です。","point":"安全余裕率が大きいほど赤字転落まで余裕。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R5-22">{"id":"R5-22","year":"R5","number":22,"question":"原価低減のためのアプローチにおいて、IE(Industrial Engineering)的アプローチ手法でないものはどれか。","choices":[{"key":"イ","text":"日程計画の見直しによる作業時間の改善"},{"key":"ロ","text":"在庫管理の徹底による在庫数の改善"},{"key":"ハ","text":"動作経済の原則に基づく動作の改善"},{"key":"ニ","text":"作業管理による作業の改善"},{"key":"ホ","text":"機能の見直しによる製品設計の改善"}],"answer":"ホ","answerText":"機能の見直しによる製品設計の改善","explanation":"機能を見直して価値を高める製品設計の改善はVE的アプローチです。IEは工程・作業・動作・在庫などの改善が中心です。","point":"IE＝作り方、VE＝機能と価値。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R5-23">{"id":"R5-23","year":"R5","number":23,"question":"次の機械等のうち、労働安全衛生法関係法令に基づく特定自主検査の対象になっていないものはどれか。","choices":[{"key":"イ","text":"動力プレス機械"},{"key":"ロ","text":"高所作業車(作業床の高さが2m以上)"},{"key":"ハ","text":"産業用ロボット"},{"key":"ニ","text":"フォークリフト"},{"key":"ホ","text":"車両系建設機械"}],"answer":"ハ","answerText":"産業用ロボット","explanation":"動力プレス、高所作業車、フォークリフト、一定の車両系建設機械などは特定自主検査の対象ですが、産業用ロボットはこの対象ではありません。","point":"特定自主検査の対象機械を区別。","problemImages":[],"choiceImages":[],"category":"安全衛生管理"}</script>
<script type="application/json" id="qdata_R5-24">{"id":"R5-24","year":"R5","number":24,"question":"A製作所は、常時使用する従業員350人の金属製品を製造する事業場である。この事業場における安全衛生管理体制に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"衛生管理者を2人以上選任しなければならない。"},{"key":"ロ","text":"総括安全衛生管理者を選任しなければならない。"},{"key":"ハ","text":"産業医を選任しなければならないが、専属の産業医である必要はない。"},{"key":"ニ","text":"安全委員会と衛生委員会、又は安全衛生委員会を設置しなければならない。"},{"key":"ホ","text":"専任の安全管理者を選任しなければならない。"}],"answer":"ホ","answerText":"専任の安全管理者を選任しなければならない。","explanation":"350人規模の金属製品製造業では安全管理者等の選任は必要ですが、人数だけを根拠に『専任の安全管理者』が必須とはなりません。","point":"選任義務と『専任』義務を分けて覚える。","problemImages":[],"choiceImages":[],"category":"安全衛生管理"}</script>
<script type="application/json" id="qdata_R5-25">{"id":"R5-25","year":"R5","number":25,"question":"労働災害の発生状況を評価する際に用いる指標に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"年千人率とは、1年間の労働者1,000人当たりに発生した死傷者数の割合を示すものである。"},{"key":"ロ","text":"年千人率は、労働時間数や労働日数に変動が多い事業場での活用に適している。"},{"key":"ハ","text":"度数率とは、100万延べ実労働時間当たりの労働災害による死傷者数をもって、労働災害の発生頻度を表すものである。"},{"key":"ニ","text":"強度率とは、1,000延べ実労働時間当たりの延べ労働損失日数をもって、労働災害の重さの程度を表すものである。"},{"key":"ホ","text":"延べ労働損失日数とは、労働災害による死傷者の延べ労働損失日数のことで、算出に当たっては、一定の基準が設けられている。"}],"answer":"ロ","answerText":"年千人率は、労働時間数や労働日数に変動が多い事業場での活用に適している。","explanation":"年千人率は労働者数を基準にするため、労働時間のばらつきを反映しにくい指標です。労働時間の違いを比較するなら度数率が適します。","point":"度数率＝100万時間当たり、強度率＝1000時間当たり損失日数。","problemImages":[],"choiceImages":[],"category":"安全衛生管理"}</script>

<script type="application/json" id="qdata_R5-28">{"id":"R5-28","year":"R5","number":28,"question":"教育訓練計画に重要となる動機づけに関する、記述中の（　）内に当てはまる語句として、適切なものはどれか。\n\n（　）では、人間を動機づける基本的欲求を、低次のものから高次のものへ5段階に階層付け、低次の欲求が充たされると順次、高次の欲求が動機づけの要因となる。","choices":[{"key":"イ","text":"TWI (Training within industry)"},{"key":"ロ","text":"CAI (Computer assisted instruction)"},{"key":"ハ","text":"KJ法"},{"key":"ニ","text":"科学的管理法"},{"key":"ホ","text":"自己実現理論"}],"answer":"ホ","answerText":"自己実現理論","explanation":"基本的欲求を段階化し、下位欲求の充足後に上位欲求が動機になるという考え方はマズローの自己実現理論です。","point":"生理→安全→社会→承認→自己実現。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R5-29">{"id":"R5-29","year":"R5","number":29,"question":"TWI－JI(仕事の教え方)における「教え方の4段階」の項目として、適切でないものはどれか。","choices":[{"key":"イ","text":"やらせてみる"},{"key":"ロ","text":"習う準備をさせる"},{"key":"ハ","text":"作業を説明する"},{"key":"ニ","text":"作業を分解する"},{"key":"ホ","text":"教えたあとをみる"}],"answer":"ニ","answerText":"作業を分解する","explanation":"TWI-JIの4段階は『習う準備をさせる→作業を説明する→やらせてみる→教えたあとをみる』です。作業を分解するのは教える前の準備です。","point":"JIの4段階を順番で暗記。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R5-30">{"id":"R5-30","year":"R5","number":30,"question":"TWI－JM(改善の仕方)の「第2段階―細目ごとに自問する」に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"自問するときは、安易な現状肯定の態度や先入観を捨てることが大切である。"},{"key":"ロ","text":"自問欄に✔印をつけることは、どの自問から着想が出たかという単なる印である。"},{"key":"ハ","text":"1つの細目について自問するとき、前の細目で着想が出ている場合は、その着想も考慮に入れて行っていく。"},{"key":"ニ","text":"6つの自問(なぜ、なに、どこ、いつ、だれ、どんな方法)それぞれについて、9項目の自問(材料、機械、設備と道具、設計、配置、動作、安全、整理整とん)も合わせて行うことが大切である。"},{"key":"ホ","text":"どんな方法が良いかの自問は、できるだけ具体的な処置まで考えて着想欄に記入し、すぐに処置をとった方がよい。"}],"answer":"ホ","answerText":"どんな方法が良いかの自問は、できるだけ具体的な処置まで考えて着想欄に記入し、すぐに処置をとった方がよい。","explanation":"JM第2段階は細目ごとに自問して改善の着想を得る段階です。具体案をすぐ実行するのではなく、展開・承認を経て第4段階で実施します。","point":"JM：分解→自問→展開→実施。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R5-31">{"id":"R5-31","year":"R5","number":31,"question":"TWI－JR(人の扱い方)「職場の問題の扱い方」の手法として、適切でないものはどれか。","choices":[{"key":"イ","text":"最初に、困っている状況を確認した後で、目的を決める。"},{"key":"ロ","text":"事実を上げた後、最初の目的を変えることもあり得る。"},{"key":"ハ","text":"第2段階の対策案は、事実に基づいて決めるべきである。"},{"key":"ニ","text":"処置案は、原則として、しきたりや方針にとらわれなくてもよい。"},{"key":"ホ","text":"第2段階の4つの確かめは、優先順位の決定の参考となる。"}],"answer":"ニ","answerText":"処置案は、原則として、しきたりや方針にとらわれなくてもよい。","explanation":"JRでは処置案を考える際も会社の方針やしきたり、関係者への影響を確認します。これらを無視してよいわけではありません。","point":"JRは事実に基づき、方針・影響を確かめて処置。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R5-32">{"id":"R5-32","year":"R5","number":32,"question":"教育訓練方法のOJTとOff－JTに関する、記述中の（　）内に当てはまる語句の組合せとして、適切なものはどれか。\n\n（①）は、職場の機械・工具を利用して、マンツーマン訓練に適している。\n（②）は、計画的・理論的な学習に適している。\n（③）は、外部のセミナーを利用することもある。\n（④）は、体系的に学ぶことが難しい。\n（⑤）の1つに、ジョブローテーションがある。","choices":[{"key":"イ","text":"①OJT／②Off－JT／③Off－JT／④OJT／⑤OJT"},{"key":"ロ","text":"①Off－JT／②OJT／③OJT／④OJT／⑤OJT"},{"key":"ハ","text":"①OJT／②Off－JT／③Off－JT／④Off－JT／⑤OJT"},{"key":"ニ","text":"①Off－JT／②OJT／③Off－JT／④OJT／⑤OJT"},{"key":"ホ","text":"①OJT／②Off－JT／③Off－JT／④OJT／⑤Off－JT"}],"answer":"イ","answerText":"①OJT／②Off－JT／③Off－JT／④OJT／⑤OJT","explanation":"職場の実機・実務で教えるのがOJT、計画的・体系的な集合教育や外部セミナーがOff-JTです。ジョブローテーションはOJTの一手段です。","point":"OJT＝職場内、Off-JT＝職場外・集合教育。","problemImages":["data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAxYAAADUCAYAAAABdrWFAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAKZkSURBVHhe7N15XFTnvT/wDwLDMMNyEIZVYEQ22QVZXHDfotIkalxj0qqpiSZpmya9rfd38/LXm7a/mza9vV0TbZZmMcZWjcGNCCqLbMO+DMKAzLAMyxEYwDPAsP3+COfcWWEQF8Dn/XrxSjirzHnmOc/3+zznORajo6OjIAiCIAiCIAiCmII5+gsIgiAIgiAIgiAmiwQWBEEQBEEQBEFMGQksCIIgCIIgCIKYMhJYEARBEARBEAQxZSSwIAiCIAiCIAhiyizIrFBPFoZh0NLSgrq6OjQ0NEAkEsHHxwc0TXO/BwcHw8PDA46Ojvq7E8QDp1aroVQq0dPTA4ZhMDQ0BEdHRwgEAlIOiXFplx1SXgiCIB4/Elg8QWiaRm5uLuRyObq7u9HQ0ACxWIzw8HDI5XKUl5dDJBLB09MTtra2iIuLQ1hYmP5hCOKBoGkaRUVFaGlpQV9fH0ZHR2Fvbw+NRgM7Ozuo1Wo4ODhg7ty58Pf3h7e3t/4hiCeQWq1GbW0tGhsbodFo0Nraivb2dlAUhXnz5mF4eBg8Hg8xMTGkzBD3jQ1a2SQci03GiUQiUr6IcdE0jf7+/ieunJDA4gkhl8uRl5cHmqbh7u6OxMREuLm56W8GlUqFvLw85OXlYc6cOYiPj0dcXBzJAhIPDNswLCwsRFVVFSiKQnh4OBfkYqwcVldXo6amBl1dXeDz+Zg/fz4pi08wttyUl5ejtbUVo6OjoChKpx5jyw3DMPDy8kJkZCQpM8Sk0DSN27dvQ61WY86cObh9+zbKy8u59WKxGO7u7ujs7IS/vz8JYAkOmyzr6OiAh4cHurq60NvbCz8/P7S0tDwxCQ8SWDwB5HI5UlJSYG1tjS1btsDNzY2rPNnhJ15eXli2bBm3j0qlwrlz53Djxg1s27YNzz77rM4xCeJ+MAyDzMxMpKamwtPTE+vXr0d4eDg3RK+npwcAdIa1qFQqnD9/Hnl5ediyZQtWrFhBGopPGO1yIxAIsHLlSqxdu1Z/M45cLkdycjIaGxuRmJhIygxhFoVCgevXr6OlpQWBgYEmE3Bs+bpz5w4CAgKwYsUK0rv/BGPbUy0tLaipqUFPTw8CAwO5sv <script type="application/json" id="qdata_R5-33">{"id":"R5-33","year":"R5","number":33,"question":"TPM(トータル・プロダクティブ・メンテナンス)の推進に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"設備の計画や保全など、一部の関係部門のみを考慮すればよい。"},{"key":"ロ","text":"トップから作業者までの全員の参加を必要としない。"},{"key":"ハ","text":"設備の導入時を対象としたPMトータルシステムを確立する。"},{"key":"ニ","text":"設備の効率を最高にすることを目標とする。"},{"key":"ホ","text":"小集団の自主的な活動を必要としない。"}],"answer":"ニ","answerText":"設備の効率を最高にすることを目標とする。","explanation":"TPMは設備効率を最大化し、トップから現場まで全員参加・小集団活動でロスをなくす考え方です。","point":"TPM＝全員参加＋設備総合効率向上。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-34">{"id":"R5-34","year":"R5","number":34,"question":"フェールソフトに関する説明として、適切なものはどれか。","choices":[{"key":"イ","text":"システムに故障が生じたときに、本質的でない機能又は性能を縮退させつつ、基本的な要求機能を果たし続けるようなシステムの設計。"},{"key":"ロ","text":"システムに故障が生じたときに、事故や災害が拡大することを防止して、安全を保つことができるようなシステムの性質。"},{"key":"ハ","text":"システムに故障が生じたときに、別の機構がその機能を援助・代行するようなシステムの設計。"},{"key":"ニ","text":"人為的に不適切な行為や過失があっても、システムの信頼性・安全性を保持する性質。"},{"key":"ホ","text":"信頼性を向上するために、システムの定格値よりも低いストレス(負荷)で運用する設計。"}],"answer":"イ","answerText":"システムに故障が生じたときに、本質的でない機能又は性能を縮退させつつ、基本的な要求機能を果たし続けるようなシステムの設計。","explanation":"フェールソフトは故障時に一部機能・性能を縮退させても、基本機能を継続させる設計です。","point":"フェールセーフ＝安全側、フェールソフト＝縮退運転。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-35">{"id":"R5-35","year":"R5","number":35,"question":"設備点検に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"油圧ポンプの異常音は、原因の一つとして、サクションフィルタの目詰まりがあげられる。"},{"key":"ロ","text":"部品搬送用エアシリンダのロッドが、電源停止の状態でも徐々に動いてしまうのは、ソレノイドバルブ内のリークも考えられる。"},{"key":"ハ","text":"油圧シリンダの動作速度が安定しないときは、エアの混入も考えられる。"},{"key":"ニ","text":"ギヤボックスの潤滑油量の日常点検は、設備の稼働時に行い、必要に応じて給油する。"},{"key":"ホ","text":"チェーンは、たるみが大きすぎると軸受に大きな衝撃を与えるので、適切なたるみとなるように調整する。"}],"answer":"ニ","answerText":"ギヤボックスの潤滑油量の日常点検は、設備の稼働時に行い、必要に応じて給油する。","explanation":"ギヤボックスの油量確認・給油は、巻き込まれや飛散を避けるため原則として停止・安全状態で行います。稼働中点検を前提とするニが不適切です。","point":"点検・給油は停止と安全確保が基本。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-36">{"id":"R5-36","year":"R5","number":36,"question":"測定器に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"サインバーは、ブロックゲージを用いて角度を測定できる。"},{"key":"ロ","text":"円筒スコヤは、円筒度の測定に使用される。"},{"key":"ハ","text":"オートコリメータは、光の反射を利用して角度や面を測定できる。"},{"key":"ニ","text":"ブロックゲージを重ねて使用するときには、リンギングが可能でなければならない。"},{"key":"ホ","text":"オプチカルフラットは、光波干渉により平面度を求めることができる。"}],"answer":"ロ","answerText":"円筒スコヤは、円筒度の測定に使用される。","explanation":"円筒スコヤは機械の直角度・垂直度などの確認に用いる基準器で、円筒度そのものを測る測定器ではありません。","point":"円筒スコヤ＝直角・垂直の基準。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-37">{"id":"R5-37","year":"R5","number":37,"question":"ベルトコンベヤの不良事項の原因及びその徴候に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"流体継手のメカニカルシール部からの油漏れが生じると、トルクの伝達が不十分となる。"},{"key":"ロ","text":"ブレーキのシュー又はドラムの摩耗が生じると、スリップが大きくなり制動距離が縮む。"},{"key":"ハ","text":"Vプーリに摩耗が生じると、Vベルトとの摩擦係数が低下してスリップする。"},{"key":"ニ","text":"ローラに摩耗が生じると、ベルトとの接触が不十分となりベルトが回転しなくなる。"},{"key":"ホ","text":"軸受に潤滑不良が生じると、異常な音、振動及び温度上昇が発生する。"}],"answer":"ロ","answerText":"ブレーキのシュー又はドラムの摩耗が生じると、スリップが大きくなり制動距離が縮む。","explanation":"ブレーキのシューやドラムが摩耗すると制動力が低下し、制動距離は長くなります。『短くなる』が逆です。","point":"摩耗→摩擦・制動力低下→停止距離増加。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-38">{"id":"R5-38","year":"R5","number":38,"question":"腐食に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"金属間又は金属と他の材料との間にすき間が存在する場合、すき間の内外においてイオン、酸素などの濃淡電池が構成されて生じる腐食を、すき間腐食という。"},{"key":"ロ","text":"空気中で金属とそれに接触する金属又は他の物質との接触面で微小滑りが繰り返し起こるとき、金属表面に生じる腐食を、異種金属接触腐食という。"},{"key":"ハ","text":"腐食と引張応力との相乗作用によって金属材料に割れを生じる現象を、応力腐食割れという。"},{"key":"ニ","text":"金属内部に向かって孔状に進行する局部腐食を、孔食という。"},{"key":"ホ","text":"流動する水、土砂などの環境物質の摩耗作用と腐食作用の相乗作用によって金属に生じる損耗を、エロージョン・コロージョンという。"}],"answer":"ロ","answerText":"空気中で金属とそれに接触する金属又は他の物質との接触面で微小滑りが繰り返し起こるとき、金属表面に生じる腐食を、異種金属接触腐食という。","explanation":"微小な相対滑りの繰返しで接触面に起こる腐食はフレッティング腐食です。異種金属接触腐食は異種金属の電位差が主因です。","point":"微小往復滑り＝フレッティング。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-39">{"id":"R5-39","year":"R5","number":39,"question":"設備診断に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"渦電流探傷試験方法は、非鉄材料や鉄鋼材料などの表面及び表面近傍のきずの検出に有効である。"},{"key":"ロ","text":"AE(アコースティック・エミッション)法は、圧力容器や配管の亀裂の検出に有効である。"},{"key":"ハ","text":"放射線透過試験方法は、金属材料や非金属材料の内部の欠陥の検出に有効である。"},{"key":"ニ","text":"超音波探傷試験方法は、溶接部や鍛造品などの内部のきずの検出に有効である。"},{"key":"ホ","text":"浸透探傷試験方法は、軸等の内部の割れや亀裂の検出に有効である。"}],"answer":"ホ","answerText":"浸透探傷試験方法は、軸等の内部の割れや亀裂の検出に有効である。","explanation":"浸透探傷は表面に開口したきずを検出する方法で、軸内部の割れを直接検出する用途には向きません。","point":"PT＝表面開口、UT/RT＝内部欠陥。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-40">{"id":"R5-40","year":"R5","number":40,"question":"設備と環境に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"騒音が90dB以上の作業環境では、耳栓等の保護具を使用させなければならない。"},{"key":"ロ","text":"空気調和設備を設けている事務室内の気温は、18℃以上28℃以下になるように努めなければならない。"},{"key":"ハ","text":"普通の作業を行う作業面の照度は、100ルクス以上でなければならない。"},{"key":"ニ","text":"情報機器作業での書類上及びキーボード上における照度は、300ルクス以上が推奨されている。"},{"key":"ホ","text":"空気調和設備を設けている事務室内に供給される空気の二酸化炭素含有率は、0.1%以下にしなければならない。"}],"answer":"ハ","answerText":"普通の作業を行う作業面の照度は、100ルクス以上でなければならない。","explanation":"普通の作業の作業面照度は100ルクスでは不足で、現行基準では150ルクス以上が基準です。","point":"照度は精密300・普通150・粗70ルクスを目安に整理。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R5-41">{"id":"R5-41","year":"R5","number":41,"question":"日本産業規格(JIS)におけるCAD用語の定義として、正しいものはどれか。","choices":[{"key":"イ","text":"自動設計とは、コンピュータ内部に表現されたモデルに基づいて、対象物の図面を自動化装置によって描くことである。"},{"key":"ロ","text":"CAMとは、製品の形状、その他の属性データからなるモデルを、コンピュータの内部に作成し解析・処理することによって進める設計のことである。"},{"key":"ハ","text":"CADとは、コンピュータの内部に表現されたモデルに基づいて、生産に必要な各種情報を生成すること、及びそれに基づいて進める生産の形式のことである。"},{"key":"ニ","text":"CAEとは、CADの過程でコンピュータ内部に作成されたモデルを利用して、各種シミュレーション、技術解析など工学的な検討を行うことである。"},{"key":"ホ","text":"自動製図とは、製品の設計に関する規則又は方法をプログラム化して、コンピュータを利用して自動的に行う設計のことである。"}],"answer":"ニ","answerText":"CAEとは、CADの過程でコンピュータ内部に作成されたモデルを利用して、各種シミュレーション、技術解析など工学的な検討を行うことである。","explanation":"CAEはCADで作成したモデルを用いて強度、熱、流体などの解析・シミュレーションを行う技術です。","point":"CAD＝設計、CAE＝解析、CAM＝製造。","problemImages":[],"choiceImages":[],"category":"自動化・生産システム"}</script>

<script type="application/json" id="qdata_R5-43">{"id":"R5-43","year":"R5","number":43,"question":"加工法に関する記述として、正しいものはどれか。","choices":[{"key":"イ","text":"放電加工は電極を用いるため、複雑な形状の広い面積を加工するのに適していない。"},{"key":"ロ","text":"電子ビーム加工は、広い面積の材料を一度に除去する加工に適しているが、溶接には適していない。"},{"key":"ハ","text":"構成刃先は、金属切削において刃物すくい面の先端部にでき、切削面を悪くする反面、刃先先端を保護する効果もある。"},{"key":"ニ","text":"レーザ加工では、セラミックなどの非金属材料の加工はできない。"},{"key":"ホ","text":"セラミック被覆加工は、炭化けい素などの材料を被覆材として、耐衝撃性を高める目的で行う。"}],"answer":"ハ","answerText":"構成刃先は、金属切削において刃物すくい面の先端部にでき、切削面を悪くする反面、刃先先端を保護する効果もある。","explanation":"構成刃先は被削材の一部が刃先付近に付着・堆積したもので、仕上げ面を悪化させる一方、刃先を保護する場合があります。","point":"構成刃先＝切削面悪化の代表原因。","problemImages":[],"choiceImages":[],"category":"加工技術"}</script>
<script type="application/json" id="qdata_R5-44">{"id":"R5-44","year":"R5","number":44,"question":"電子ビーム加工に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"電子ビーム加工は、基本現象面から熱加工と非熱加工(化学加工)に大別され、熱加工には除去(穴あけ、切断、トリミングなど)、溶接、表面処理(焼入れ、溶融)、アニーリング、蒸着などの加工法があり、非熱加工にはリソグラフィやキュアリングなどの加工法がある。"},{"key":"ロ","text":"電子ビームによる熱加工では、真空(10^-1～10^-6 Torr)中で高電圧(10～数百kV)をかけて電子を加速し、材料表面に加速電子を投射して、そのエネルギーを熱に変えて溶融・蒸発現象を引き起こす。"},{"key":"ハ","text":"電子ビームは集束性が良く、ビーム径を小さく絞れるため、加工エネルギーを集中でき、パワー密度が大きいことから、多様な材料の微細加工が可能である。"},{"key":"ニ","text":"電子は質量が小さく(9×10^-28g)、電荷量が大きいため、電気的・磁気的に高速制御が容易であることから、電子ビームを自由に偏向走査して複雑・微細形状の加工に利用できる。"},{"key":"ホ","text":"電子ビーム加工では高電圧を使用するため、γ線の発生を伴い、加工装置ではγ線の遮蔽が必要になる。"}],"answer":"ホ","answerText":"電子ビーム加工では高電圧を使用するため、γ線の発生を伴い、加工装置ではγ線の遮蔽が必要になる。","explanation":"電子ビームを高電圧で加速すると制動X線が発生するため遮蔽が必要です。γ線が発生するという表現が誤りです。","point":"電子ビーム装置の放射線対策＝X線遮蔽。","problemImages":[],"choiceImages":[],"category":"加工技術"}</script>
<script type="application/json" id="qdata_R5-45">{"id":"R5-45","year":"R5","number":45,"question":"レーザ溶接に関する記述中の（　）内に当てはまる語句として、正しいものはどれか。\n\n（　）とは、レーザ媒質がクロムイオンをドーピングした単結晶のアルミニウム酸化物であるレーザをいう。","choices":[{"key":"イ","text":"ルビーレーザ"},{"key":"ロ","text":"ガラスレーザ"},{"key":"ハ","text":"YAGレーザ"},{"key":"ニ","text":"エキシマレーザ"},{"key":"ホ","text":"TEAレーザ"}],"answer":"イ","answerText":"ルビーレーザ","explanation":"ルビーレーザはAl₂O₃（サファイア）結晶にCr³⁺を添加した固体レーザです。","point":"ルビー＝Al₂O₃＋Cr。","problemImages":[],"choiceImages":[],"category":"加工技術"}</script>
<script type="application/json" id="qdata_R5-46">{"id":"R5-46","year":"R5","number":46,"question":"材料に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"FRMは、金属に炭化けい素、ボロン繊維、アルミナなどを入れて強化した複合材料である。"},{"key":"ロ","text":"FRPは、プラスチックにガラス繊維、炭素繊維等を加えて耐久性を持たせた複合材料である。"},{"key":"ハ","text":"FRCは、コンクリートに鋼繊維、炭素繊維、アラミド繊維等を加えて引張力を補強した複合材料である。"},{"key":"ニ","text":"形状記憶合金は、一般にチタンとニッケルの合金で、超弾性の性質をもつ。"},{"key":"ホ","text":"ファインセラミックスは、化学組成・結晶構造・形状・製造工程などを精密に制御して製造され、新しい機能又は特性をもつ、主として非金属の有機物質である。"}],"answer":"ホ","answerText":"ファインセラミックスは、化学組成・結晶構造・形状・製造工程などを精密に制御して製造され、新しい機能又は特性をもつ、主として非金属の有機物質である。","explanation":"ファインセラミックスは高度に制御して作られる主として無機・非金属材料です。『有機物質』とするホが誤りです。","point":"セラミックス＝無機・非金属。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R5-47">{"id":"R5-47","year":"R5","number":47,"question":"ファインセラミックスに関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"繊維強化セラミックス基複合材料とは、繊維を配合することによって強度、じん性などを強化したものである。"},{"key":"ロ","text":"ウィスカ強化セラミックス基複合材料とは、ウィスカを配合することによって強度、じん性などを強化したものである。"},{"key":"ハ","text":"サーメットとは、硬さ、耐熱性、耐酸化性、耐薬品性、耐摩耗性を特徴とするセラミックスと、強じん性、可塑性を特徴とする樹脂を組み合わせたものである。"},{"key":"ニ","text":"粒子強化セラミックス基複合材料とは、異なる材質の粒子を配合することによって強度、じん性などを強化したものである。"},{"key":"ホ","text":"ナノコンポジットとは、サブミクロンサイズの粒子、薄膜などの相を、別の材料の粒界、粒内、層間などに分散・配置させたものである。"}],"answer":"ハ","answerText":"サーメットとは、硬さ、耐熱性、耐酸化性、耐薬品性、耐摩耗性を特徴とするセラミックスと、強じん性、可塑性を特徴とする樹脂を組み合わせたものである。","explanation":"サーメットはceramic＋metalの複合材料です。セラミックスと樹脂の組合せではありません。","point":"cermet＝ceramic＋metal。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R5-48">{"id":"R5-48","year":"R5","number":48,"question":"ファインセラミックスに関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"絶縁セラミックスとは、電気絶縁体として用いられるセラミックスで、スパークプラグ、IC基板など幅広く利用されている。"},{"key":"ロ","text":"誘電セラミックスとは、電荷の担体が電子である導電性セラミックスで、半導体的特性を示すもの、金属的特性を示すもの及び超電導特性を示すものがある。"},{"key":"ハ","text":"圧電セラミックスとは、印加電圧の作用によって、結晶がひずむ性質をもつセラミックスで、機械的エネルギーと電気的エネルギーとの相互変換に利用される。"},{"key":"ニ","text":"焦電セラミックスとは、電気的自発分極をもつために、外部電場を加えなくても、温度を変化させるだけでその表面に正負の電荷を発生する性質をもつセラミックスである。"},{"key":"ホ","text":"磁性セラミックスとは、酸化鉄を主成分とする自発磁化をもつセラミックスで、代表的なものに、軟磁性体のスピネル型、ガーネット型及び硬磁性体のマグネトプラムバイト型構造の化合物がある。"}],"answer":"ロ","answerText":"誘電セラミックスとは、電荷の担体が電子である導電性セラミックスで、半導体的特性を示すもの、金属的特性を示すもの及び超電導特性を示すものがある。","explanation":"誘電セラミックスは電界で分極する性質を利用する絶縁性材料です。ロの説明は導電性セラミックスの説明です。","point":"誘電＝分極、導電＝電流を流す。","problemImages":[],"choiceImages":[],"category":"材料"}</script>
<script type="application/json" id="qdata_R5-49">{"id":"R5-49","year":"R5","number":49,"question":"座標測定機(三次元測定機)に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"座標測定機(三次元測定機)とは、プロービングシステムを移動させ、測定物表面上の空間座標を決定する能力がある測定システムである。"},{"key":"ロ","text":"プロービングシステムとは、プローブ(エキステンションを含む)、プローブ交換システム、スタイラス(エキステンションを含む)、スタイラス交換システムで構成されるシステムである。"},{"key":"ハ","text":"プロービングシステムは、ラムに繋がっている。"},{"key":"ニ","text":"プロービングシステムのうち、測定物と接触する機械的な要素は、プローブである。"},{"key":"ホ","text":"プロービングシステムには、接触プロービングシステムのほか、非接触プロービングシステムもある。"}],"answer":"ニ","answerText":"プロービングシステムのうち、測定物と接触する機械的な要素は、プローブである。","explanation":"測定物に実際に接触する機械要素はスタイラスチップです。プローブは信号発生を含む検出装置全体を指します。","point":"CMM：プローブ／スタイラス／スタイラスチップを区別。","problemImages":[],"choiceImages":[],"category":"測定・検査"}</script>

<script type="application/json" id="qdata_R6-01">{"id":"R6-01","year":"R6","number":1,"question":"生産の基本活動に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"生産設計は、製品の品質機能を展開し、 製品の諸特性を決め、 製造方法や材料を決める活動である。"},{"key":"ロ","text":"小日程計画では、工程ごとの生産時期を決める。"},{"key":"ハ","text":"差立ては、生産に必要な品目とその所要量、品質、必要時期などを決める活動である。"},{"key":"ニ","text":"最終製品の検査・調整は、 市場や顧客に対して品質を保証するために重要な活動である。"},{"key":"ホ","text":"バッファーとしての在庫は、 生産等の活動に伴って生じる様々な変動を吸収するために置かれる。"}],"answer":"ハ","answerText":"差立ては、生産に必要な品目とその所要量、品質、必要時期などを決める活動である。","explanation":"差立ては、すでに計画された仕事を現場へ具体的に指示し着手させる活動です。品目・所要量・必要時期を決めるのは資材計画側です。","point":"差立て＝現場への作業指示。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R6-02">{"id":"R6-02","year":"R6","number":2,"question":"MRP(Material Requirements Planning)システムに直接、 関連する用語として、適切でないものはどれか。","choices":[{"key":"イ","text":"独立需要品目と従属需要品目"},{"key":"ロ","text":"生産の平準化と1個流し"},{"key":"ハ","text":"サマリー表とストラクチャー表"},{"key":"ニ","text":"タイムフェイズとタイムバケット"},{"key":"ホ","text":"プライオリティ計画、キャパシティ計画及びショップフロア・コントロール"}],"answer":"ロ","answerText":"生産の平準化と1個流し","explanation":"MRPは部品表、独立・従属需要、タイムフェイズ、能力計画などと直接関係します。平準化・1個流しは主にJIT/リーン生産の考え方です。","point":"MRP＝所要量を時系列で展開。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R6-03">{"id":"R6-03","year":"R6","number":3,"question":"市場や顧客がメーカーに求める事柄を、一般に「需要の三要素」と呼んでいるが、この三要素の組合せとして、適切なものはどれか。","choices":[{"key":"イ","text":"品質／価格／納期"},{"key":"ロ","text":"技術／品質／価格"},{"key":"ハ","text":"作業者／納期／品質"},{"key":"ニ","text":"原材料／納期／価格"},{"key":"ホ","text":"技術／品質／納期"}],"answer":"イ","answerText":"品質／価格／納期","explanation":"顧客が求める基本三要素はQCD、すなわちQuality（品質）・Cost（価格/コスト）・Delivery（納期）です。","point":"QCDを最優先で暗記。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>

<script type="application/json" id="qdata_R7-02">{"id":"R7-02","year":"R7","number":2,"question":"生産形態、生産方式に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"受注生産は、顧客が定めた仕様の製品を生産者が生産する方式である。"},{"key":"ロ","text":"プロセス生産は、多くの種類の部品が加工され、それらが階層的に組み上げられて、完成品を生産する方式である。"},{"key":"ハ","text":"個別生産では、生産量が1単位あるいは数単位であることが多い。"},{"key":"ニ","text":"ライン生産では、各作業ステーションに作業を均等に配分するというラインバランシングの考え方が必要である。"},{"key":"ホ","text":"ストックポイント生産方式は、 見込み生産で部品や半製品を作り、 最終的には顧客の注文に基づいて生産する方式である。"}],"answer":"ロ","answerText":"プロセス生産は、多くの種類の部品が加工され、それらが階層的に組み上げられて、完成品を生産する方式である。","explanation":"ロは多数の部品を階層的に組み上げる組立生産の説明です。プロセス生産は原料を物理的・化学的に連続処理して製品化します。","point":"プロセス生産と組立生産を区別。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-03">{"id":"R7-03","year":"R7","number":3,"question":"工程管理の役割に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"工程管理では、物的要求と時間的要求などの市場の要求を満たす必要がある。"},{"key":"ロ","text":"工程管理の目的には、 計画品質の維持、納期の厳守と生産期間の短縮、計画原価の維持と低減などがある。"},{"key":"ハ","text":"工程管理には、生産計画の機能と生産統制の機能が含まれる。"},{"key":"ニ","text":"工程管理の中心は、作業管理である。"},{"key":"ホ","text":"工程管理には、作業を行う人員の配置の業務も含まれる。"}],"answer":"ニ","answerText":"工程管理の中心は、作業管理である。","explanation":"工程管理は生産計画と生産統制を通じ、品質・納期・原価を維持する活動です。作業管理だけを中心とするものではありません。","point":"工程管理＝計画＋統制。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-04">{"id":"R7-04","year":"R7","number":4,"question":"日程計画の作成や作業の指示のために用いられる一般的な手法や図表として、適切でないものはどれか。","choices":[{"key":"イ","text":"製造三角図"},{"key":"ロ","text":"アローダイヤグラム"},{"key":"ハ","text":"ガントチャート"},{"key":"ニ","text":"ピッチダイヤグラム"},{"key":"ホ","text":"特性要因図"}],"answer":"ホ","answerText":"特性要因図","explanation":"特性要因図は品質問題の原因分析に使う図で、日程計画や作業指示の図表ではありません。","point":"日程：ガント、アロー、ピッチ。原因分析：特性要因図。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-05">{"id":"R7-05","year":"R7","number":5,"question":"現品管理の目的として、適切なものはどれか。","choices":[{"key":"イ","text":"生産負荷の変動を防止すること。"},{"key":"ロ","text":"工程内での加工不良を防止すること。"},{"key":"ハ","text":"現品の加工遅れを防止すること。"},{"key":"ニ","text":"現品の紛失などによる数量不足を防止すること。"},{"key":"ホ","text":"生産能力の変動を防止すること。"}],"answer":"ニ","answerText":"現品の紛失などによる数量不足を防止すること。","explanation":"現品管理は現物の数量・所在・保管・移動を管理し、紛失や取り違えによる数量不足を防ぐのが重要な目的です。","point":"現品管理＝現物の所在と数量。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-06">{"id":"R7-06","year":"R7","number":6,"question":"生産統制における進度管理に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"進度管理は、進捗管理とも呼ばれている。"},{"key":"ロ","text":"進度管理の目的は、納期の確保と生産速度の維持や向上である。"},{"key":"ハ","text":"進度管理の内容には、日程計画に対する進度の調整がある。"},{"key":"ニ","text":"進度管理の方法は、生産形態により異なる。"},{"key":"ホ","text":"進度管理の範囲は、受注から納入までの全ての日程が対象である。"}],"answer":"ホ","answerText":"進度管理の範囲は、受注から納入までの全ての日程が対象である。","explanation":"進度管理は生産計画に対する工程内の進み具合を管理する活動です。受注から納入までの全日程を一括管理する概念とは異なります。","point":"進度管理は工程の進捗を対象。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-07">{"id":"R7-07","year":"R7","number":7,"question":"余力管理の主な目的に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"工程に余力を作ることである。"},{"key":"ロ","text":"作業の進行状況を把握し、時間の遅れを調整することである。"},{"key":"ハ","text":"工程の負荷と能力を均衡させることである。"},{"key":"ニ","text":"停滞・保管の状況を把握することである。"},{"key":"ホ","text":"工程の不具合による数量不足を防止することである。"}],"answer":"ハ","answerText":"工程の負荷と能力を均衡させることである。","explanation":"余力管理の目的は、工程の生産能力と負荷を比較し、過負荷や余りをならして均衡させることです。","point":"余力管理＝負荷平準化。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-08">{"id":"R7-08","year":"R7","number":8,"question":"在庫管理における在庫の役割とその名称に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"需要変動による生産と出荷の差を吸収するための製品在庫"},{"key":"ロ","text":"各工程中の生産能力のばらつきを吸収するための仕掛品在庫"},{"key":"ハ","text":"納品不足の発生に対応するための資材在庫"},{"key":"ニ","text":"加工途中の不具合品に対応するための仕掛品在庫"},{"key":"ホ","text":"個別生産方式の受注において、納期を短縮するための見込み製品在庫"}],"answer":"ホ","answerText":"個別生産方式の受注において、納期を短縮するための見込み製品在庫","explanation":"個別生産は受注仕様に応じて作るため、納期短縮目的で完成品を見込み在庫するのは基本的に適しません。","point":"個別受注品は完成品在庫を持ちにくい。","problemImages":[],"choiceImages":[],"category":"工程管理"}</script>
<script type="application/json" id="qdata_R7-09">{"id":"R7-09","year":"R7","number":9,"question":"作業の標準に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"作業標準は、 各工程を対象に、作業方法などに関する基準を規定したものである。"},{"key":"ロ","text":"標準時間は、主体作業時間と余裕時間で構成される。"},{"key":"ハ","text":"正味時間は、作業遂行に直接必要な時間である。"},{"key":"ニ","text":"余裕率は、標準時間に占める余裕時間の割合である。"},{"key":"ホ","text":"人的余裕には、疲労余裕が含まれる。"}],"answer":"ロ","answerText":"標準時間は、主体作業時間と余裕時間で構成される。","explanation":"標準時間は正味時間（主体作業・準備段取等）に余裕時間を加えたものです。主体作業時間だけと余裕時間の和ではありません。","point":"標準時間＝正味時間＋余裕時間。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R7-10">{"id":"R7-10","year":"R7","number":10,"question":"作業研究における分析手法に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"工程分析では、質の検査を□、量の検査を◇で表す。"},{"key":"ロ","text":"加工経路分析では、対象品の変化を移動の経路と工程記号により、レイアウト図上に表す。"},{"key":"ハ","text":"運搬工程分析では、移動と取扱いをどちらも○で表す。"},{"key":"ニ","text":"サーブリック分析では、基本動作を図示記号又は文字記号で表す。"},{"key":"ホ","text":"流れ線図では、レイアウト図上に、工程記号を用いずに、対象品の動きを、線を用いて表す。"}],"answer":"ニ","answerText":"サーブリック分析では、基本動作を図示記号又は文字記号で表す。","explanation":"サーブリック分析は人の基本動作を細分し、図示記号や文字記号で表して動作のムダを分析します。","point":"サーブリック＝基本動作分析。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R7-11">{"id":"R7-11","year":"R7","number":11,"question":"ストップウォッチ法による直接時間研究に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"対象作業の要素作業への分け方として、機械加工の場合、ワーク着脱の手作業と自動切削の機械作業は、同一の要素作業として扱う。"},{"key":"ロ","text":"観測用具として、ストップウォッチ、観測用紙、筆記具などが必要であり、観測目的や対象作業によって、動画の撮影も行われる。"},{"key":"ハ","text":"時間観測の方法の一つである継続法は、要素作業の終了時点ごとに時計から時刻を読みとり、通し時間を記録する方法である。"},{"key":"ニ","text":"継続法での観測記録の要領として、毎回繰り返す正規作業はあらかじめ用紙に記入しておき、例外作業は、発生するたびに作業名を記入する。"},{"key":"ホ","text":"要素作業ごとに個別時間の異常値を除去し、 正常観測値を決め、レイティング係数によって正味時間を求める。"}],"answer":"イ","answerText":"対象作業の要素作業への分け方として、機械加工の場合、ワーク着脱の手作業と自動切削の機械作業は、同一の要素作業として扱う。","explanation":"ワーク着脱の手作業と自動切削の機械作業は性質・時間変動が異なるため、別の要素作業として分けて観測するのが基本です。","point":"要素作業は性質が異なる動作を分離。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R7-12">{"id":"R7-12","year":"R7","number":12,"question":"アイディア発想の技法の一つであるブレーンストーミングの基本ルールとして、適切でないものはどれか。","choices":[{"key":"イ","text":"アイディアの表現は、 参加メンバーにわかりやすく、 単純にしなければならない。"},{"key":"ロ","text":"他人のアイディアを部分的に変えたり、複数のアイディアを結合したりして、 アイディアをさらに発展させる。"},{"key":"ハ","text":"他人から出されたアイディアを、評価したり批判したりしてはならない。"},{"key":"ニ","text":"自由で奇抜なアイディア、技術的・経済的に困難と思われるアイディア、 理想的なアイディアなども望まれる。"},{"key":"ホ","text":"アイディアを数多く出すことが大切であり、参加メンバーの積極的な発言を重視する。"}],"answer":"イ","answerText":"アイディアの表現は、 参加メンバーにわかりやすく、 単純にしなければならない。","explanation":"ブレーンストーミングの基本ルールは批判禁止、自由奔放、量を求める、結合・改善です。『表現を単純にしなければならない』は基本ルールではありません。","point":"BSの4原則をそのまま暗記。","problemImages":[],"choiceImages":[],"category":"作業管理"}</script>
<script type="application/json" id="qdata_R7-13">{"id":"R7-13","year":"R7","number":13,"question":"品質管理に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"品質には、「ねらいの品質」と「適合の品質」がある。"},{"key":"ロ","text":"「製品の品質」と「製品のグレード(等級)」は、同じである。"},{"key":"ハ","text":"総合的品質管理(TQM)には、その目的の策定が含まれる。"},{"key":"ニ","text":"製品の機能には影響しない程度の小さいばらつきを許容して、 製品を経済的に生産することも大切である。"},{"key":"ホ","text":"「結果が良ければ、全て良し。」ということではなく、その結果に至るプロセスが重要である。"}],"answer":"ロ","answerText":"「製品の品質」と「製品のグレード(等級)」は、同じである。","explanation":"品質は要求への適合度、グレードは同じ用途の製品の機能・特性の水準区分です。同じ概念ではありません。","point":"品質とグレード（等級）は別物。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R7-14">{"id":"R7-14","year":"R7","number":14,"question":"品質を管理して、 品質保証を行うのが品質管理の目的であるが、 品質保証の基本的な考え方に関する記述として、適切でないものはどれか、","choices":[{"key":"イ","text":"消費者指向"},{"key":"ロ","text":"品質第一主義"},{"key":"ハ","text":"品質に対し、トップ以下の全従業員が関心をもつこと。"},{"key":"ニ","text":"品質のPDCAを回し、品質を絶えず向上させていくこと。"},{"key":"ホ","text":"品質保証は、検査部門の責任であり、製造部門に責任は及ばない。"}],"answer":"ホ","answerText":"品質保証は、検査部門の責任であり、製造部門に責任は及ばない。","explanation":"品質保証は検査部門だけの仕事ではなく、設計・購買・製造・検査・サービスを含む組織全体の責任です。","point":"品質は工程で作り込む。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>

<script type="application/json" id="qdata_R7-18">{"id":"R7-18","year":"R7","number":18,"question":"計数規準型一回抜取検査に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"消費者危険とは、統計的検定における第二種の誤りのことである。"},{"key":"ロ","text":"合格となったロット中には、不適合品(不良品)は含まれていない、。"},{"key":"ハ","text":"個々の製品の良否を判定するので、その品質判定基準のみがあればよい。"},{"key":"ニ","text":"ロットを代表するサンプルがとれない場合でも、所定の数のサンプルが得られればよい。"},{"key":"ホ","text":"不適合(規格に合わない)と判定した製品のみを、不合格とすればよい。"}],"answer":"イ","answerText":"消費者危険とは、統計的検定における第二種の誤りのことである。","explanation":"消費者危険は不良ロットを合格としてしまう危険で、統計的検定の第2種の誤りに対応します。","point":"生産者危険＝α、消費者危険＝β。","problemImages":[],"choiceImages":[],"category":"品質管理"}</script>
<script type="application/json" id="qdata_R7-19">{"id":"R7-19","year":"R7","number":19,"question":"原価企画のプロセスに関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"開発段階から、販売価格の予想を立てる。"},{"key":"ロ","text":"予想販売価格から目標利益額を差し引いて、目標原価を設定する。"},{"key":"ハ","text":"目標原価を達成するよう、設計変更を繰り返す。"},{"key":"ニ","text":"原価の見積りは、製造段階において行う。"},{"key":"ホ","text":"目標原価の達成状況を勘案しつつ、標準原価を設定する。"}],"answer":"ニ","answerText":"原価の見積りは、製造段階において行う。","explanation":"原価企画は企画・設計段階から販売価格・目標利益を見込み、目標原価を設定して作り込む活動です。製造段階だけで見積もるのでは遅すぎます。","point":"目標原価＝予想販売価格－目標利益。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R7-20">{"id":"R7-20","year":"R7","number":20,"question":"原価要素のうち、加工費に含まれないものはどれか。","choices":[{"key":"イ","text":"直接材料費"},{"key":"ロ","text":"間接材料費"},{"key":"ハ","text":"直接労務費"},{"key":"ニ","text":"間接労務費"},{"key":"ホ","text":"間接経費"}],"answer":"イ","answerText":"直接材料費","explanation":"加工費は材料を加工するために要する労務費・経費等で、製品そのものを構成する直接材料費は含めません。","point":"加工費＝直接材料費を除いた加工に要する費用。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R7-21">{"id":"R7-21","year":"R7","number":21,"question":"固定費、変動費及び損益分岐点に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"固定費の総額は、操業度が上がっても一定である。"},{"key":"ロ","text":"製品単位当たりの固定費は、操業度が上がっても一定である。"},{"key":"ハ","text":"製品単位当たりの変動費は、操業度が上がるほど多くなる。"},{"key":"ニ","text":"変動費と固定費から、損益分岐点を求めることができる。"},{"key":"ホ","text":"固定費を下げれば、製品単位当たりの変動費も必ず下がる。"}],"answer":"イ","answerText":"固定費の総額は、操業度が上がっても一定である。","explanation":"一定の操業範囲では固定費総額は生産量にかかわらずほぼ一定です。生産量が増えると製品1個当たり固定費は小さくなります。","point":"固定費総額は一定、単位当たり固定費は低下。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R7-22">{"id":"R7-22","year":"R7","number":22,"question":"VE(価値工学)に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"VEでは、使用上の価値だけでなく、魅力などに関する価値も考慮する。"},{"key":"ロ","text":"VEにおける原価は、製品のライフサイクルコストを意味している。"},{"key":"ハ","text":"、VEによって不必要な機能を見つけ、原価低減を図ることができる。"},{"key":"ニ","text":"VEにおける価値指数は、品質と原価の比で示される。"},{"key":"ホ","text":"VEでは、価値指数を大きくすることを目指す。"}],"answer":"ニ","answerText":"VEにおける価値指数は、品質と原価の比で示される。","explanation":"VEの価値指数は一般に機能÷コストで評価します。品質÷原価という定義ではありません。","point":"VE：Value＝Function／Cost。","problemImages":[],"choiceImages":[],"category":"原価管理"}</script>
<script type="application/json" id="qdata_R7-23">{"id":"R7-23","year":"R7","number":23,"question":"労働安全衛生法関係法令において、 安全衛生教育又は安全衛生特別教育を行うよう義務付けられていない対象者(努力義務を含む)はどれか。","choices":[{"key":"イ","text":"新たに雇い入れた労働者"},{"key":"ロ","text":"厚生労働省令で定められた危険又は有害な業務にこれから従事させる労働者"},{"key":"ハ","text":"厚生労働省令で定められた危険又は有害な業務に現に従事している労働者"},{"key":"ニ","text":"安全委員会又は衛生委員会の委員に指名する労働者"},{"key":"ホ","text":"作業内容が変更された労働者"}],"answer":"ニ","answerText":"安全委員会又は衛生委員会の委員に指名する労働者","explanation":"安全委員会・衛生委員会の委員に指名すること自体は、雇入れ時教育や危険有害業務の特別教育のような法定教育対象ではありません。","point":"雇入れ時・作業変更時・危険有害業務の教育を整理。","problemImages":[],"choiceImages":[],"category":"安全衛生管理"}</script>

<script type="application/json" id="qdata_R7-25">{"id":"R7-25","year":"R7","number":25,"question":"事故や災害が発生したときの第一次措置(緊急時の措置)として、適切でないものはどれか。","choices":[{"key":"イ","text":"被災者の救急処置"},{"key":"ロ","text":"二次災害の防止措置"},{"key":"ハ","text":"関係者への連絡や上司への報告"},{"key":"ニ","text":"災害発生現場における災害原因調査"},{"key":"ホ","text":"機械・装置の緊急停止"}],"answer":"ニ","answerText":"災害発生現場における災害原因調査","explanation":"事故直後は救命、設備停止、二次災害防止、連絡を優先します。原因調査は現場の安全が確保された後に行います。","point":"緊急時は『人命・拡大防止』が最優先。","problemImages":[],"choiceImages":[],"category":"安全衛生管理"}</script>
<script type="application/json" id="qdata_R7-26">{"id":"R7-26","year":"R7","number":26,"question":"環境基本法において、「地球環境保全」の定義として、挙げられていないものはどれか。","choices":[{"key":"イ","text":"台風や地震等の自然現象による災害に係る環境の保全"},{"key":"ロ","text":"オゾン層の破壊の進行に係る環境の保全"},{"key":"ハ","text":"地球全体の温暖化に係る環境の保全"},{"key":"ニ","text":"海洋の汚染に係る環境の保全"},{"key":"ホ","text":"野生生物の種の減少に係る環境の保全"}],"answer":"イ","answerText":"台風や地震等の自然現象による災害に係る環境の保全","explanation":"地球環境保全は温暖化、オゾン層、海洋汚染、野生生物種減少など地球規模の環境問題を対象とします。台風・地震そのものはこの定義に含まれません。","point":"地球環境問題と自然災害を分ける。","problemImages":[],"choiceImages":[],"category":"環境管理"}</script>
<script type="application/json" id="qdata_R7-27">{"id":"R7-27","year":"R7","number":27,"question":"大気汚染防止法に基づき、排出基準等が定められている大気汚染物質を排出する施設として、規定されていないものはどれか。","choices":[{"key":"イ","text":"ばい煙発生施設"},{"key":"ロ","text":"揮発性有機化合物排出施設"},{"key":"ハ","text":"特定悪臭物質排出施設"},{"key":"ニ","text":"水銀排出施設"},{"key":"ホ","text":"特定粉じん発生施設"}],"answer":"ハ","answerText":"特定悪臭物質排出施設","explanation":"悪臭は悪臭防止法で規制されます。大気汚染防止法の施設区分には、ばい煙、VOC、水銀、特定粉じん等があります。","point":"悪臭→悪臭防止法。","problemImages":[],"choiceImages":[],"category":"環境管理"}</script>
<script type="application/json" id="qdata_R7-28">{"id":"R7-28","year":"R7","number":28,"question":"マズローの欲求段階説で示される欲求として、適切でないものはどれか。","choices":[{"key":"イ","text":"生理的欲求・・・・・食物や睡眠などを求める欲求"},{"key":"ロ","text":"衛生の欲求・・・・・住居や衣服の衛生などを求める欲求"},{"key":"ハ","text":"社会的欲求・・・・・愛されたい、グループの一員でありたいという欲求"},{"key":"ニ","text":"自我(承認)の欲求・・有用でありたい、尊敬されたいという欲求"},{"key":"ホ","text":"自己実現の欲求・・・自己の潜在能力を最大限に発揮したいという欲求"}],"answer":"ロ","answerText":"衛生の欲求・・・・・住居や衣服の衛生などを求める欲求","explanation":"マズローの基本5欲求は生理、安全、社会、承認、自己実現です。『衛生の欲求』という段階はありません。","point":"第2段階は安全の欲求。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R7-29">{"id":"R7-29","year":"R7","number":29,"question":"TWIJI(仕事の教え方)において、「教え方の 4段階」の第 1 段階でやる「習う準備をさせる」の細目として、適切でないものはどれか。","choices":[{"key":"イ","text":"気楽にさせる。"},{"key":"ロ","text":"何の作業をするかを話す。"},{"key":"ハ","text":"その作業について知っている程度を確かめる。"},{"key":"ニ","text":"作業場を整備させる。"},{"key":"ホ","text":"作業を覚えたい気持ちにさせる。"}],"answer":"ニ","answerText":"作業場を整備させる。","explanation":"JI第1段階『習う準備をさせる』には、気楽にさせる、仕事を話す、知識を確かめる、興味を持たせる等があります。作業場の整備はこの細目ではありません。","point":"JI第1段階の細目を覚える。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>

<script type="application/json" id="qdata_R7-31">{"id":"R7-31","year":"R7","number":31,"question":"TWI-JR(人の扱い方)の中で、人との関係を良くするための基本心得を挙げているが、次のうち、その心得にない項目はどれか。","choices":[{"key":"イ","text":"良くないときに、人前で叱らない。"},{"key":"ロ","text":"仕事ぶりが良いかどうか当人に言ってやる。"},{"key":"ハ","text":"良いときは、ほめる。"},{"key":"ニ","text":"当人に影響がある変更は、前もって知らせる。"},{"key":"ホ","text":"当人の力をいっぱいに生かす。"}],"answer":"イ","answerText":"良くないときに、人前で叱らない。","explanation":"JRの基本心得には、仕事ぶりを本人に伝える、良いときほめる、変更は前もって知らせる、能力を活かす等があります。『人前で叱らない』はこの基本心得の列挙項目ではありません。","point":"JRの4つの基本心得を暗記。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R7-32">{"id":"R7-32","year":"R7","number":32,"question":"教育訓練後の効果測定である、カークパトリックの評価法において、 評価のレベルが最も高い評価の内容はどれか。","choices":[{"key":"イ","text":"受講者は、そのコースに満足したか。"},{"key":"ロ","text":"受講者は、何を習得したか。"},{"key":"ハ","text":"受講者は、習得したことを職場で利用したか。"},{"key":"ニ","text":"受講者が所属する職場は良くなったか。"},{"key":"ホ","text":"受講者が成長したか。"}],"answer":"ニ","answerText":"受講者が所属する職場は良くなったか。","explanation":"カークパトリックの最高レベルはLevel 4『Results（結果）』で、教育が職場・組織の成果改善につながったかを評価します。","point":"反応→学習→行動→結果。","problemImages":[],"choiceImages":[],"category":"作業指導・教育訓練"}</script>
<script type="application/json" id="qdata_R7-33">{"id":"R7-33","year":"R7","number":33,"question":"設備効率に関する式として、適切なものはどれか。","choices":[{"key":"イ","text":"良品率＝(投入数量－不良数量)÷投入数量"},{"key":"ロ","text":"性能稼働率＝正味稼働率×速度稼働率×良品率"},{"key":"ハ","text":"正味稼働率＝(理論サイクルタイム×投入数量)÷稼働時間"},{"key":"ニ","text":"時間稼働率＝(負荷時間－停止時間)÷停止時間"},{"key":"ホ","text":"設備総合効率＝時間稼働率×性能稼働率×良品率"}],"answer":"ホ","answerText":"設備総合効率＝時間稼働率×性能稼働率×良品率","explanation":"設備総合効率(OEE)は時間稼働率×性能稼働率×良品率で表します。停止・速度低下・不良の3大ロスを総合評価します。","point":"OEE＝Availability×Performance×Quality。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-34">{"id":"R7-34","year":"R7","number":34,"question":"設備の状況を表す次の記述のうち、予防保全の優先度が最も高いものはどれか。","choices":[{"key":"イ","text":"稼働率がほぼ100%の設備で、故障による損失が大きい設備"},{"key":"ロ","text":"価格が非常に高い設備で、操業度が著しく低い設備"},{"key":"ハ","text":"初工程で使用されている設備で、代替設備があるもの"},{"key":"ニ","text":"機械故障による損失額よりも、予防保全費用の方が大きい設備"},{"key":"ホ","text":"省人化のために導入された設備で、簡単に操作できる設備"}],"answer":"イ","answerText":"稼働率がほぼ100%の設備で、故障による損失が大きい設備","explanation":"高稼働で故障時損失が大きい設備は、停止影響が極めて大きいため予防保全の優先度が高くなります。","point":"保全優先度＝故障確率×影響度＋代替性など。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-35">{"id":"R7-35","year":"R7","number":35,"question":"転がり軸受の損傷現象の一つである「フレッチング」の、日本産業規格(JIS)における故障モードの分類はどれか。","choices":[{"key":"イ","text":"転がり接触疲労"},{"key":"ロ","text":"腐食"},{"key":"ハ","text":"電食"},{"key":"ニ","text":"塑性変形"},{"key":"ホ","text":"亀裂及び破壊"}],"answer":"ロ","answerText":"腐食","explanation":"転がり軸受のフレッチングは、微小相対運動により接触面が酸化・摩耗する現象で、JISの故障モードでは腐食に分類されます。","point":"フレッチング＝微動摩耗・腐食。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-36">{"id":"R7-36","year":"R7","number":36,"question":"設備点検に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"回転体のアンバランスによって発生する振動数は、回転数の2倍と一致する。"},{"key":"ロ","text":"18－8ステンレス鋼の表面や表層の欠陥の検出には、磁粉探傷試験が用いられる。"},{"key":"ハ","text":"金属摩耗粉や異物の混入は潤滑油を劣化させるが、 水分の混入は潤滑油の劣化には影響しない。"},{"key":"ニ","text":"圧力容器の耐圧試験において、圧力が試験圧力に達したら、直ちに減圧する。"},{"key":"ホ","text":"転がり軸受を取り外した際に、軌道面、転動体、つば、はめあい面、保持器等の摩耗状態を見る。"}],"answer":"ホ","answerText":"転がり軸受を取り外した際に、軌道面、転動体、つば、はめあい面、保持器等の摩耗状態を見る。","explanation":"軸受を外したときは軌道面、転動体、つば、はめあい面、保持器などの摩耗・損傷状態を観察するのが基本点検です。","point":"軸受点検は転動面＋はめあい＋保持器。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-37">{"id":"R7-37","year":"R7","number":37,"question":"日本産業規格(JIS)における、滑り軸受の摩耗に関する記述として、正しいものはどれか。","choices":[{"key":"イ","text":"ハイドロアブレイシブ摩耗とは、材料と雰囲気との化学的及び／又は電気化学的相互作用を伴う機械的摩耗の過程をいう。"},{"key":"ロ","text":"疲労摩耗とは、接触面が摩擦によって互いに凝着し、固体表面からの脱落又は移着によって不規則な表面が生じる機械的摩耗の過程をいう。"},{"key":"ハ","text":"流体浸食とは、接触する2物体に微小な振動的相対滑りを与えたときに生じる機械的摩耗の過程をいう。"},{"key":"ニ","text":"酸化摩耗とは、摩擦面材料の微小体積が繰返し応力を受けるときに疲労破壊によって起こる機械的摩耗の過程をいう。"},{"key":"ホ","text":"電食摩耗とは、接触する2物体間に電流が流れるときに接触面間に起こる放電による摩耗の過程をいう。"}],"answer":"ホ","answerText":"電食摩耗とは、接触する2物体間に電流が流れるときに接触面間に起こる放電による摩耗の過程をいう。","explanation":"電食摩耗は接触面間に電流が流れ、放電によって表面が損傷する摩耗です。ホだけが用語と説明が対応しています。","point":"電食＝電流・放電による損傷。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-38">{"id":"R7-38","year":"R7","number":38,"question":"不良事項の原因とその徴候に関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"テーパころ軸受で取付け予圧量が過大の場合、 早期に、 はめあい面にかじりが生じることがある。"},{"key":"ロ","text":"交流のソレノイドバルブにおいて、スプールに異物がかみ込むと、スプールの温度が上昇して、焼損に至ることがある。"},{"key":"ハ","text":"かご形三相誘導電動機を直入れ始動する場合、頻繁な始動や停止を繰り返しても加熱しない。"},{"key":"ニ","text":"油圧回路の作動油中に空気が混入していると、ポンプや制御弁に異常騒音や異常振動が生じる原因になることがある。"},{"key":"ホ","text":"金属材料の引張強さよりも低い荷重であっても、常温で繰返し荷重が加わると、脆性破壊が生じることがある。"}],"answer":"ニ","answerText":"油圧回路の作動油中に空気が混入していると、ポンプや制御弁に異常騒音や異常振動が生じる原因になることがある。","explanation":"油圧油に空気が混入するとキャビテーションや圧縮性の影響で、ポンプ・制御弁に騒音や振動が出ることがあります。","point":"油圧のエア混入＝騒音・振動・不安定動作。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-39">{"id":"R7-39","year":"R7","number":39,"question":"設備に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"一般に、深溝玉軸受は、ラジアル荷重とスラスト荷重を受けることができる。"},{"key":"ロ","text":"浸透探傷試験は、割れやき裂等の表面欠陥の判定に適している検査方法である。"},{"key":"ハ","text":"Vベルト伝動では、Vプーリの溝底にVベルトが当たらないようにする。"},{"key":"ニ","text":"ベルト伝動は、ベルトとベルト車間の摩擦による伝動であるため、確実に一定の速度比を保つことができる。"},{"key":"ホ","text":"ギヤー油は、日本産業規格(JIS)において、工業用2種類と自動車用3種類に分けられている。"}],"answer":"ニ","answerText":"ベルト伝動は、ベルトとベルト車間の摩擦による伝動であるため、確実に一定の速度比を保つことができる。","explanation":"ベルト伝動は摩擦で動力を伝えるため滑りが生じ得ます。したがって歯車のように常に一定の速度比を保証できません。","point":"ベルト＝滑りあり、歯車＝速度比が確実。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-40">{"id":"R7-40","year":"R7","number":40,"question":"設備と環境に関する記述として、適切でないものはどれか。","choices":[{"key":"イ","text":"蒸気、ガス又は粉じんにより爆発の危険がある場所で電気機器を使用して作業を行う場合、防爆構造の電気機器を使用しなければならない。"},{"key":"ロ","text":"空気調和設備を設けている事務室内の気温は、18℃以上28℃以下になるように努めなければならない。"},{"key":"ハ","text":"常時就業させる場所で粗な作業を行う場合の作業面の照度は、50ルクス以上とされている。"},{"key":"ニ","text":"空気調和設備を設けている事務室内に供給される空気の二酸化炭素の含有率は、0.1%以下にしなければならない。"},{"key":"ホ","text":"屋内作業場で第一種有機溶剤等又は第二種有機溶剤等に係る有機溶剤業務を行う作業場所には、当該蒸気の発散源の密閉設備、局所排気装置又はブッシュプル型換気装置を設けなければならない。"}],"answer":"ハ","answerText":"常時就業させる場所で粗な作業を行う場合の作業面の照度は、50ルクス以上とされている。","explanation":"粗な作業の照度基準は50ルクスではなく70ルクス以上です。ほかの選択肢は設備・環境に関する基準に合致します。","point":"照度：精密300・普通150・粗70ルクス。","problemImages":[],"choiceImages":[],"category":"設備管理"}</script>
<script type="application/json" id="qdata_R7-41">{"id":"R7-41","year":"R7","number":41,"question":"自動生産システムに関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"PDMとは、 販売計画、 生産計画、 調達、 製造、出荷などの生産管理の基本諸機能を統合化する情報システムをいう。"},{"key":"ロ","text":"CAMとは、生産現場で時々刻々に発生する生産情報を、その発生源(機械・設備・作業者・工作物など)から直接に採取し、リアルタイムに情報を処理して、 現場管理者に提供すること、又はその判断結果を現場に指示することをいう。"},{"key":"ハ","text":"CAPPとは、コンピュータの内部に作成した生産情報を元に、作業手順などの工程設計を行う方式をいう。"},{"key":"ニ","text":"MRPとは、生産活動を行うための情報を、データベースを使用して統合的に管理することをいう。"},{"key":"ホ","text":"POPとは、コンピュータの内部に表現されたモデルに基づいて、 生産に必要な各種情報を作成すること、及びそれに基づいて進める生産の形式をいう。"}],"answer":"ハ","answerText":"CAPPとは、コンピュータの内部に作成した生産情報を元に、作業手順などの工程設計を行う方式をいう。","explanation":"CAPPはComputer Aided Process Planningで、製品・生産情報を使って加工順序や作業手順などの工程設計を支援します。","point":"CAPP＝工程設計。","problemImages":[],"choiceImages":[],"category":"自動化・生産システム"}</script>
<script type="application/json" id="qdata_R7-42">{"id":"R7-42","year":"R7","number":42,"question":"自動生産システムに関する記述として、適切なものはどれか。","choices":[{"key":"イ","text":"PLMとは、 製造プロセスの実行を統制し、 生産指示、 実績収集、 進捗管理などの機能を通して、生産現場での品質・コスト・納期の管理を可能にするシステムをいう。"},{"key":"ロ","text":"MESとは、製品の企画、設計開発、製造、保守及び回収(廃棄)といったライフサイクル全体を、製品情報を中心に包括的に管理する考え方及びそれを実現するシステムの総称をいう。"},{"key":"ハ","text":"FMSとは、数値制御工作機械に、ストッカ、自動供給装置、着脱装置などを備え、複数の種類の製品を製造できる機械をいう。"},{"key":"ニ","text":"FMCとは、生産設備の全体をコンピュータで統括的に制御・管理することによって、混合生産、生産内容の変更などが可能な生産システムをいう。"},{"key":"ホ","text":"CIMとは、生産に関係する全ての情報をコンピュータネットワーク及びデータベースを用いて統括的に制御・管理することによって、 生産活動の最適化を図る生産システムをいう。"}],"answer":"ホ","answerText":"CIMとは、生産に関係する全ての情報をコンピュータネットワーク及びデータベースを用いて統括的に制御・管理することによって、 生産活動の最適化を図る生産システムをいう。","explanation":"CIMは設計・生産・管理など生産に関係する情報をネットワークとデータベースで統合し、生産活動全体を最適化する考え方です。","point":"CIM＝工場全体の情報統合。","problemImages":[],"choiceImages":[],"category":"自動化・生産システム"}</script>
<script type="application/json" id="qdata_R7-43">{"id":"R7-43","year":"R7","number":43,"question":"日本産業規格(JIS)における、工作機械の工作方法に関する記述として、誤っているものはどれか。","choices":[{"key":"イ","text":"超仕上げとは、固い表面の工具を工作物に押し付けながら滑らせることによって行う表面の仕上げをいう。"},{"key":"ロ","text":"バフ仕上げとは、バフの表面にバフ研磨材を付けて工作物に押し付け、バフ軸を回転させて行う表面の仕上げをいう。"},{"key":"ハ","text":"ポリシングとは、研磨布紙、樹脂などを用いて行う表面の仕上げをいう。"},{"key":"ニ","text":"バレル仕上げとは、工作物、と粒、及び研磨作業を助ける固形物をバレルの中に入れ、バレルを回転させて行う表面の仕上げをいう。"},{"key":"ホ","text":"と粒流動加工とは、研磨材を混練した半固体状で粘弾性をもつ材料を、加工箇所に機械的に押し込んで圧接移動させて行う表面の仕上げをいう。"}],"answer":"イ","answerText":"超仕上げとは、固い表面の工具を工作物に押し付けながら滑らせることによって行う表面の仕上げをいう。","explanation":"超仕上げは微細なと粒を持つ砥石を低い圧力で工作物に当て、短い往復振動などを与えて仕上げる加工です。イの説明は定義として不適切です。","point":"超仕上げ＝微細砥石＋低圧＋振動。","problemImages":[],"choiceImages":[],"category":"加工技術"}</script>
